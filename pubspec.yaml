name: wms_core
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # ТВОЇ ПАКЕТИ, ЯКІ БУЛИ ВТРАЧЕНІ:
  flutter_riverpod: any
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: any
  qr_flutter: any
  barcode_widget: any
  mobile_scanner: any
  image_picker: any
  google_mlkit_text_recognition: any
  share_plus: any
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  isar_generator: ^3.1.0+1
  flutter_launcher_icons: ^0.13.1

# ПРАВИЛЬНИЙ БЛОК ДЛЯ ЛОГОТИПА
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/sklado.png"
  adaptive_icon_background: "#111111"
  adaptive_icon_foreground: "assets/icon/sklado.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/