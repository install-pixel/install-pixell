  if (p.happy > 0) {
    // ^^ щасливі очі
    ctx.strokeStyle = '#2a1a0c'; ctx.lineWidth = 4;
    for (const s of [-1, 1]) {
      ctx.beginPath(); ctx.arc(s * ex, ey + 3, 7, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
    }
    ctx.fillStyle = '#7a2e1f';
    ctx.beginPath(); ctx.arc(0, 12, 9, 0, Math.PI); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ff8a8a';
    ctx.beginPath(); ctx.arc(0, 17, 4.5, 0, Math.PI); ctx.fill();
    return;
  }

  const wide = p.scared ? 1.25 : 1;
  for (const s of [-1, 1]) {
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#2a1a0c'; ctx.lineWidth = 2.5;
    ctx.beginPath();
    if (p.blink > 0) {
      ctx.moveTo(s * ex - 8, ey); ctx.lineTo(s * ex + 8, ey); ctx.stroke();
      continue;
    }
    ctx.ellipse(s * ex, ey, 8.5 * wide, 10.5 * wide, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#2a1a0c';
    const pr = p.scared ? 3.6 : 4.8;
    ctx.beginPath(); ctx.arc(s * ex + lookX, ey + 1, pr, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(s * ex + lookX + 1.6, ey - 1.5, 1.6, 0, Math.PI * 2); ctx.fill();
  }
  // брови
  ctx.strokeStyle = '#6b4423'; ctx.lineWidth = 3;
  if (p.scared) {
    ctx.beginPath(); ctx.moveTo(-ex - 8, ey - 18); ctx.lineTo(-ex + 6, ey - 15); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ex + 8, ey - 18); ctx.lineTo(ex - 6, ey - 15); ctx.stroke();
  }
  // рот
  if (p.scared) {
    ctx.fillStyle = '#7a2e1f';
    ctx.beginPath(); ctx.ellipse(0, 15, 5, 6.5, 0, 0, Math.PI * 2); ctx.fill();
    // крапля поту
    ctx.fillStyle = '#7ec8ff';
    ctx.beginPath();
    ctx.moveTo(36, -22); ctx.quadraticCurveTo(43, -12, 36, -8); ctx.quadraticCurveTo(29, -12, 36, -22);
    ctx.fill();
  } else {
    ctx.strokeStyle = '#2a1a0c'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 9, 7, 0.2, Math.PI - 0.2); ctx.stroke();
  }
}

/* ---- HUD ---- */
function drawHUD(wd) {
  // рахунок
  outlinedText(String(score), W / 2, 50, 46, '#fff');
  // рівень + прогрес
  const prog = clamp(traveled / levelDist, 0, 1);
  const bw = 210, bx = W / 2 - bw / 2, by = 88;
  ctx.fillStyle = 'rgba(255,255,255,.18)'; rr(bx, by, bw, 12, 6); ctx.fill();
  if (boss) {
    const f = clamp(boss.hp / boss.maxHp, 0, 1);
    ctx.fillStyle = '#ff4d4d'; if (f > 0.01) { rr(bx, by, Math.max(12, bw * f), 12, 6); ctx.fill(); }
    outlinedText(BOSS_NAMES[boss.kind], W / 2, 113, 13, '#ffb4b4', 'transparent');
  } else {
    ctx.fillStyle = '#ffd166'; if (prog > 0.01) { rr(bx, by, Math.max(12, bw * prog), 12, 6); ctx.fill(); }
    if (bossPlan !== null && !bossDone) { ctx.fillStyle = '#ff4d4d'; ctx.beginPath(); ctx.arc(bx + bw * bossPlan, by + 6, 7, 0, Math.PI * 2); ctx.fill(); }
    if (event && event.kind !== 'mom' && event.dur) outlinedText(EVENTS[event.kind].name.replace('!', '') + ' ' + Math.ceil(event.t) + 'с', W / 2, 113, 13, '#ffd166', 'transparent');
  }
  ctx.font = '900 15px "Arial Black",Arial,sans-serif';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffffffcc';
  ctx.textAlign = 'right'; ctx.fillText(lvlName(level), bx - 10, by + 7);
  ctx.textAlign = 'left'; ctx.fillText('🏁', bx + bw + 8, by + 7);

  // низ: комбо і швидкість
  if (combo > 1) {
    const pulse = 1 + Math.max(0, player.happy) * 0.6;
    outlinedText('СМЕТАНКА x' + combo, 20, 706, 20 * pulse, '#ffd166', '#2a1a0c', 'left');
  }
  if (state === 'play') outlinedText('x' + (speed / 255).toFixed(1) + ' швидкість', W - 20, 706, 17, '#fff', '#2a1a0c', 'right');
  // активний ефект і щит
  const hy = 744;
  if (power) {
    const blinkOff = power.t < 1.2 && Math.floor(time * 8) % 2;
    if (!blinkOff) drawPickup(power.kind, 34, hy, 0.55, false);
    const bw2 = 160, bx2 = 62;
    ctx.fillStyle = 'rgba(255,255,255,.18)'; rr(bx2, hy - 6, bw2, 12, 6); ctx.fill();
    const f = clamp(power.t / power.dur, 0, 1);
    ctx.fillStyle = power.kind === 'chili' ? '#ff6f59' : power.kind === 'ice' ? '#7ec8ff' : power.kind === 'super' ? '#ff4d6d' : '#ffd166';
    if (f > 0.02) { rr(bx2, hy - 6, Math.max(12, bw2 * f), 12, 6); ctx.fill(); }
  }
  if (shield) { drawPickup('butter', W - 118, hy, 0.5, false); outlinedText('ЩИТ', W - 96, hy, 16, '#ffd166', '#2a1a0c', 'left'); }
  if (!tut) outlinedText('рекорд ' + Math.max(save.best, score), W / 2, 778, 15, '#ffffff99', 'transparent');
}

function drawBanner() {
  const b = banner;
  const t = b.t / b.dur;
  let s = t < 0.15 ? easeOut(t / 0.15) * 1.1 : (t < 0.25 ? lerp(1.1, 1, (t - 0.15) / 0.1) : 1);
  const a = t > 0.8 ? 1 - (t - 0.8) / 0.2 : 1;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.translate(W / 2, FIELD_TOP + 150);
  ctx.scale(s, s);
  ctx.rotate(-0.04);
  outlinedText(b.text, 0, 0, b.text.length > 14 ? 30 : 38, b.color);
  if (b.sub) outlinedText(b.sub, 0, 40, 20, '#fff');
  ctx.restore();
}

/* =========================================================
   ІНТЕРФЕЙС (HTML-оверлеї)
   ========================================================= */
const $ = id => document.getElementById(id);
const ovMenu = $('ovMenu'), ovPause = $('ovPause'), ovOver = $('ovOver'), ovSkins = $('ovSkins'), ovAch = $('ovAch');
const btnPause = $('btnPause'), btnSound = $('btnSound');
let menuWorld = 0, menuSelected = 0;

function showOverlay(el) {
  for (const o of [ovMenu, ovPause, ovOver, ovSkins, ovAch]) o.classList.toggle('show', o === el);
}

function renderSoundBtn() {
  btnSound.innerHTML = save.muted
    ? '<svg viewBox="0 0 24 24" fill="#fff"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9l5 6M21 9l-5 6" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="#fff"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
}
btnSound.addEventListener('click', e => {
  e.stopPropagation();
  save.muted = !save.muted; persist(); renderSoundBtn();
  ensureAudio(); SFX.click();
});
renderSoundBtn();

function openMenu() {
  state = 'menu';
  level = Math.min(save.maxLevel, TOTAL_LEVELS - 1);
  menuSelected = level;
  menuWorld = Math.floor(level / 10);
  obstacles = []; creams = []; popups = []; banner = null;
  pickups = []; power = null; shield = false; decoy = null; speedMul = 1; invuln = 0;
  event = null; eventPlan = null; momDark = 0; boss = null; bossPending = false; bossPlan = null;
  resetPlayer();
  applyTheme();
  btnPause.style.display = 'none';
  $('btnSkipTut').style.display = 'none';
  tut = null;
  buildMenu();
  showOverlay(ovMenu);
}

function buildMenu() {
  $('playSub').textContent = 'Рівень ' + lvlName(menuSelected) + ' · ' + WORLDS[Math.floor(menuSelected / 10)].name;
  $('wName').innerHTML = 'Світ ' + (menuWorld + 1) + '<small>' + WORLDS[menuWorld].name + '</small>';
  $('wPrev').disabled = menuWorld === 0;
  $('wNext').disabled = menuWorld >= Math.floor(save.maxLevel / 10) || menuWorld >= WORLDS.length - 1;
  const grid = $('lvlGrid');
  grid.innerHTML = '';
  for (let i = 0; i < 10; i++) {
    const g = menuWorld * 10 + i;
    const b = document.createElement('button');
    b.textContent = (menuWorld + 1) + '-' + (i + 1);
    if (g > save.maxLevel) b.disabled = true;
    if (g === menuSelected) b.classList.add('cur');
    b.addEventListener('click', () => { SFX.click(); menuSelected = g; level = g; applyTheme(); buildMenu(); });
    grid.appendChild(b);
  }
  $('menuStats').innerHTML = 'Рекорд: <b>' + save.best + '</b> &nbsp;·&nbsp; Найдалі: <b>' + lvlName(save.maxLevel) + '</b>';
  $('btnAch').textContent = 'Досягнення ' + ACH.filter(a => save.ach[a.id]).length + '/' + ACH.length;
  renderToggles();
}
$('wPrev').addEventListener('click', () => { if (menuWorld > 0) { menuWorld--; SFX.click(); buildMenu(); } });
$('wNext').addEventListener('click', () => { menuWorld++; SFX.click(); buildMenu(); });
$('btnPlay').addEventListener('click', () => { startRun(menuSelected); });

const FAKE_P = { squash: 0, vy: 0, dead: false, splat: 0, blink: 0, happy: 0, scared: 0, look: 0 };
const skinOpen = sk => !sk.ach || !!save.ach[sk.ach];
function buildSkins() {
  const grid = $('skinGrid');
  grid.innerHTML = '';
  for (const sk of SKINS) {
    const open = skinOpen(sk);
    const d = document.createElement('div');
    d.className = 'skin' + (save.skin === sk.id ? ' cur' : '');
    const cv = document.createElement('canvas');
    cv.width = 220; cv.height = 220;
    const old = ctx;
    ctx = cv.getContext('2d');
    ctx.setTransform(1.55, 0, 0, 1.55, 0, 0);
    drawPelmen(71, 82, FAKE_P, NOFX, sk.id);
    if (!open) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalCompositeOperation = 'source-atop';
      ctx.fillStyle = 'rgba(20,24,30,.97)'; ctx.fillRect(0, 0, 220, 220);
      ctx.globalCompositeOperation = 'source-over';
      if (sk.secret) { ctx.font = '900 90px Arial'; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('?', 110, 120); }
    }
    ctx = old;
    d.appendChild(cv);
    const nm = document.createElement('div'); nm.className = 'nm';
    nm.textContent = open || !sk.secret ? sk.name : '???';
    d.appendChild(nm);
    const rq = document.createElement('div'); rq.className = 'req';
    if (!open) { const a = ACH.find(q => q.id === sk.ach); rq.textContent = sk.secret ? 'секретний' : '🔒 ' + a.desc; }
    else rq.textContent = save.skin === sk.id ? 'обрано' : 'відкрито';
    d.appendChild(rq);
    d.addEventListener('click', () => {
      if (!skinOpen(sk)) { SFX.tick(); return; }
      save.skin = sk.id; persist(); SFX.click(); buildSkins();
    });
    grid.appendChild(d);
  }
}
function buildAch() {
  const list = $('achList');
  list.innerHTML = '';
  for (const a of ACH) {
    const got = !!save.ach[a.id];
    const d = document.createElement('div');
    d.className = 'ach' + (got ? '' : ' off');
    const sk = SKINS.find(q => q.ach === a.id);
    const hidden = a.secret && !got;
    d.innerHTML = '<div class="ic">' + (got ? '🏆' : '🔒') + '</div><div class="tx"><b>' + (hidden ? '???' : a.name) + '</b><span>' +
      (hidden ? 'секретне досягнення' : a.desc) + (sk && !hidden ? ' · скін «' + sk.name + '»' : '') + '</span></div>';
    list.appendChild(d);
  }
}
$('btnSkins').addEventListener('click', () => { SFX.click(); buildSkins(); showOverlay(ovSkins); });
function renderToggles() {
  for (const id of ['btnMusic', 'btnMusic2']) $(id).classList.toggle('off', !save.music);
  $('btnVibro').classList.toggle('off', !save.vibro);
}
for (const id of ['btnMusic', 'btnMusic2']) $(id).addEventListener('click', () => { ensureAudio(); save.music = !save.music; persist(); renderToggles(); SFX.click(); });
$('btnVibro').addEventListener('click', () => { save.vibro = !save.vibro; persist(); renderToggles(); SFX.click(); vib(30); });
$('btnTut').addEventListener('click', () => { SFX.click(); startRun(0, { tut: { step: 0, t: 0, wait: 0 } }); });
$('btnSkipTut').addEventListener('click', e => { e.stopPropagation(); SFX.click(); if (tut) { creams = []; obstacles = []; finishTut(); } });
$('btnAch').addEventListener('click', () => { SFX.click(); buildAch(); showOverlay(ovAch); });
$('btnSkinsBack').addEventListener('click', () => { SFX.click(); buildMenu(); showOverlay(ovMenu); });
$('btnAchBack').addEventListener('click', () => { SFX.click(); buildMenu(); showOverlay(ovMenu); });

function pauseGame() {
  if (state !== 'play') return;
  state = 'paused';
  touch = null;
  btnPause.style.display = 'none';
  showOverlay(ovPause);
}
function resumeGame() {
  if (state !== 'paused') return;
  renderToggles();
  ensureAudio();
  state = 'play';
  countdown = 1.5;           // коротке «3-2-1», щоб встигнути зорієнтуватись
  btnPause.style.display = 'flex';
  showOverlay(null);
}
btnPause.addEventListener('click', e => { e.stopPropagation(); pauseGame(); });
$('btnResume').addEventListener('click', resumeGame);
$('btnPauseMenu').addEventListener('click', () => { SFX.click(); openMenu(); });

let overShownAt = 0;
function showGameOver() {
  state = 'over';
  overShownAt = performance.now();
  $('overComment').textContent = pick(DEATH_COMMENTS);
  $('overLevel').textContent = 'Розплющено на рівні ' + lvlName(level) + ' · ' + WORLDS[Math.floor(level / 10)].name;
  $('overScore').textContent = score;
  $('overRec').innerHTML = isNewRecord ? '<div class="newrec">НОВИЙ РЕКОРД!</div>' : '';
  $('overStats').innerHTML = 'Рекорд: <b>' + save.best + '</b> &nbsp;·&nbsp; Сметанок: <b>' + runCream + '</b>' +
    (runBestCombo > 1 ? ' &nbsp;·&nbsp; Комбо: <b>x' + runBestCombo + '</b>' : '') +
    (runNear > 0 ? '<br>«Ледь не»: <b>' + runNear + '</b>' : '');
  if (isNewRecord) SFX.record();
  showOverlay(ovOver);
}
$('btnAgain').addEventListener('click', () => {
  if (performance.now() - overShownAt < 350) return; // від випадкового тапу
  startRun(level);
});
$('btnOverMenu').addEventListener('click', () => { SFX.click(); openMenu(); });

document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
window.addEventListener('blur', () => pauseGame());

/* =========================================================
   ГОЛОВНИЙ ЦИКЛ
   ========================================================= */
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05; // захист від стрибків після згортання
  // дрібні кроки — щоб швидкі ножі не «проскакували» крізь пельменя
  const steps = Math.ceil(dt / 0.0125);
  const sdt = dt / steps;
  for (let i = 0; i < steps; i++) update(sdt);
  render();
  updateMusicState();
  requestAnimationFrame(frame);
}

// хук для автотестів (на гру не впливає)
window.__pelmen = { get: () => ({ state, level, score, speed, obstacles, creams, player, combo, pickups, power, shield, runNear }),
  front: frontDist, past: obPast, collect: k => collectBonus({ kind: k, x: PX, y: player.y }),
  force: k => { const w = SPAWN[k](); return w; },
  icon: size => { const cv = document.createElement('canvas'); cv.width = cv.height = size; const old = ctx; ctx = cv.getContext('2d');
    ctx.fillStyle = '#1d3a34'; ctx.fillRect(0, 0, size, size); const sc = size / 150; ctx.setTransform(sc, 0, 0, sc, 0, 0);
    ctx.fillStyle = '#cfeee3'; ctx.beginPath(); ctx.arc(75, 75, 60, 0, Math.PI * 2); ctx.fill();
    drawPelmen(75, 80, { squash: 0, vy: 0, dead: false, splat: 0, blink: 0, happy: 0.5, scared: 0, look: 0 }, NOFX, 'classic'); ctx = old; return cv.toDataURL('image/png'); },
  tutInfo: () => tut && { step: tut.step },
  ev: k => startEvent(k), bossNow: () => { bossPending = true; }, info: () => ({ boss: boss && { hp: boss.hp, phase: boss.phase, kind: boss.kind }, event: event && event.kind, ach: Object.keys(save.ach) }),
  move: moveTo, threat: threatensLane, start: startRun, LANES, PX };

openMenu();
requestAnimationFrame(frame);
// встановлення як застосунок: працює, коли гру відкрито з сайту (https), а не як файл
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
})();
</script>
