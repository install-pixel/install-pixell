<style>

  html, body {
    margin:0; height:100%; overflow:hidden; background:#10201d;
    font-family:"Arial Black","Segoe UI",Roboto,Helvetica,Arial,sans-serif; font-weight:900;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
    overscroll-behavior:none; touch-action:none;
  }
  #wrap {

  }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .hudbtn {
    position:absolute; top:2.2%; width:11%; aspect-ratio:1; border-radius:50%;
    border:none; background:rgba(255,255,255,.14); color:#fff; font-size:min(5vw,22px);
    display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:5;
    padding:0;
  }
  .hudbtn:active { transform:scale(.92); }
  button { font-weight:900; }
  #btnSound { right:3%; }
  #btnPause { left:3%; display:none; }
  .hudbtn svg { width:55%; height:55%; }
  .overlay {
    position:absolute; inset:0; display:none; flex-direction:column; align-items:center;
    justify-content:center; text-align:center; color:#fff; z-index:4; padding:6%;
    background:rgba(10,20,18,.55);
  }
  .overlay.show { display:flex; animation:fadeIn .25s ease-out; }

  @keyframes popIn { 0%{transform:scale(.6);opacity:0} 70%{transform:scale(1.06)} 100%{transform:scale(1);opacity:1} }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
  .title { font-size:calc(var(--u)*11); line-height:1; letter-spacing:1px; color:#fff;
    text-shadow:calc(var(--u)*0.55) 0 0 #3b2412, calc(var(--u)*-0.55) 0 0 #3b2412, 0 calc(var(--u)*0.55) 0 #3b2412, 0 calc(var(--u)*-0.55) 0 #3b2412, calc(var(--u)*0.39) calc(var(--u)*0.39) 0 #3b2412, calc(var(--u)*-0.39) calc(var(--u)*0.39) 0 #3b2412, calc(var(--u)*0.39) calc(var(--u)*-0.39) 0 #3b2412, calc(var(--u)*-0.39) calc(var(--u)*-0.39) 0 #3b2412, 0 calc(var(--u)*1.3) 0 #0006; }
  .subtitle { font-size:calc(var(--u)*5); color:#ffd166; margin-top:calc(var(--u)*1.5);
    text-shadow:calc(var(--u)*0.32) 0 0 #3b2412, calc(var(--u)*-0.32) 0 0 #3b2412, 0 calc(var(--u)*0.32) 0 #3b2412, 0 calc(var(--u)*-0.32) 0 #3b2412, calc(var(--u)*0.22) calc(var(--u)*0.22) 0 #3b2412, calc(var(--u)*-0.22) calc(var(--u)*0.22) 0 #3b2412, calc(var(--u)*0.22) calc(var(--u)*-0.22) 0 #3b2412, calc(var(--u)*-0.22) calc(var(--u)*-0.22) 0 #3b2412; }
  .card { background:rgba(255,255,255,.1); border-radius:calc(var(--u)*4); padding:calc(var(--u)*4);
    width:100%; margin-top:calc(var(--u)*5); animation:popIn .35s ease-out; }
  .btn {
    display:block; width:100%; border:none; border-radius:calc(var(--u)*4); cursor:pointer;
    font-family:inherit; font-size:calc(var(--u)*7); padding:calc(var(--u)*3.6) 0; color:#3b2412;
    background:linear-gradient(#ffe08a,#ffb703); box-shadow:0 calc(var(--u)*1.4) 0 #b97a00;
    margin-top:calc(var(--u)*4);
  }
  .btn:active { transform:translateY(calc(var(--u)*1)); box-shadow:0 calc(var(--u)*.4) 0 #b97a00; }
  .btn.big { font-size:calc(var(--u)*9); animation:pulse 1.4s ease-in-out infinite; }
  .btn.small { font-size:calc(var(--u)*4.6); padding:calc(var(--u)*2.4) 0; background:rgba(255,255,255,.16);
    color:#fff; box-shadow:none; }
  .btn .sub { display:block; font-size:.5em; opacity:.75; margin-top:.2em; }
  .stats { font-size:calc(var(--u)*4.2); opacity:.9; margin-top:calc(var(--u)*3); line-height:1.5; }
  .hint { font-size:calc(var(--u)*3.6); opacity:.85; margin-top:calc(var(--u)*4); line-height:1.6;
    font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif; font-weight:700; }
  .worldsel { display:flex; align-items:center; justify-content:space-between; margin-top:calc(var(--u)*3); }
  .worldsel button { width:calc(var(--u)*10); height:calc(var(--u)*10); border:none; border-radius:50%;

  .worldsel button:disabled { opacity:.25; }
  .wname { font-size:calc(var(--u)*4.4); }
  .wname small { display:block; font-size:.7em; opacity:.7; }
  .grid { display:grid; grid-template-columns:repeat(5,1fr); gap:calc(var(--u)*2); margin-top:calc(var(--u)*3); }
  .grid button { aspect-ratio:1.25; border:none; border-radius:calc(var(--u)*2.4); font-family:inherit;
    font-size:calc(var(--u)*4.4); background:rgba(255,255,255,.9); color:#3b2412; cursor:pointer; }
  .grid button.cur { background:#ffb703; }
  .grid button:disabled { background:rgba(255,255,255,.12); color:#fff6; }
  .comment { font-size:calc(var(--u)*7.4); line-height:1.15; color:#fff; animation:popIn .4s ease-out;

  .bigscore { font-size:calc(var(--u)*14); color:#ffd166; line-height:1.1; text-shadow:calc(var(--u)*0.6) 0 0 #3b2412, calc(var(--u)*-0.6) 0 0 #3b2412, 0 calc(var(--u)*0.6) 0 #3b2412, 0 calc(var(--u)*-0.6) 0 #3b2412, calc(var(--u)*0.42) calc(var(--u)*0.42) 0 #3b2412, calc(var(--u)*-0.42) calc(var(--u)*0.42) 0 #3b2412, calc(var(--u)*0.42) calc(var(--u)*-0.42) 0 #3b2412, calc(var(--u)*-0.42) calc(var(--u)*-0.42) 0 #3b2412; }
  .newrec { display:inline-block; background:#ff6f59; color:#fff; border-radius:calc(var(--u)*3);
    padding:calc(var(--u)*1.2) calc(var(--u)*3); font-size:calc(var(--u)*4.6); margin-top:calc(var(--u)*2);
    animation:pulse .8s ease-in-out infinite; }
  .row2 { display:flex; gap:calc(var(--u)*2.5); }
  .row2 .btn { flex:1; }
  .scroll { overflow-y:auto; touch-action:pan-y; -webkit-overflow-scrolling:touch; max-height:58vh; }
  .skins { display:grid; grid-template-columns:repeat(3,1fr); gap:calc(var(--u)*2.4); }
  .skin { background:rgba(255,255,255,.1); border-radius:calc(var(--u)*3); padding:calc(var(--u)*1.5); border:calc(var(--u)*.6) solid transparent; cursor:pointer; }
  .skin.cur { border-color:#ffb703; background:rgba(255,183,3,.18); }
  .skin canvas { position:static; width:100%; height:auto; aspect-ratio:1; }
  .skin .nm { font-size:calc(var(--u)*3.4); margin-top:calc(var(--u)*.6); }
  .skin .req { font-size:calc(var(--u)*2.7); opacity:.7; font-family:"Segoe UI",Roboto,Arial,sans-serif; font-weight:700; margin-top:calc(var(--u)*.4); }
  .ach { display:flex; align-items:center; gap:calc(var(--u)*3); text-align:left; padding:calc(var(--u)*2.2) calc(var(--u)*1); border-bottom:1px solid rgba(255,255,255,.1); }
  .ach .ic { font-size:calc(var(--u)*6.5); width:calc(var(--u)*9); text-align:center; flex:none; }
  .ach .tx b { display:block; font-size:calc(var(--u)*4.2); }
  .ach .tx span { font-size:calc(var(--u)*3.3); opacity:.75; font-family:"Segoe UI",Roboto,Arial,sans-serif; font-weight:700; }
  .ach.off { opacity:.5; }
  .row2 .btn.tg { font-size:calc(var(--u)*3.6); padding:calc(var(--u)*2) 0; }
  .btn.tg.off { opacity:.5; }
  #btnSkipTut { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:auto; padding:calc(var(--u)*2) calc(var(--u)*5);
    font-size:calc(var(--u)*3.6); display:none; z-index:5; margin:0; }
  .muted-line { font-size:calc(var(--u)*3.8); opacity:.75; margin-top:calc(var(--u)*1.5); }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>

  <button class="hudbtn" id="btnPause" aria-label="Пауза">
    <svg viewBox="0 0 24 24" fill="#fff"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg>

      <div class="scroll" id="achList"></div>
      <button class="btn small" id="btnAchBack">Назад</button>
    </div>
  </div>

  <!-- ПАУЗА -->
  <div class="overlay" id="ovPause">
    <div class="title" style="font-size:calc(var(--u)*12)">ПАУЗА</div>
    <div class="card">
      <button class="btn big" id="btnResume">ГРАТИ ДАЛІ</button>
      <div class="row2">
        <button class="btn small tg" id="btnMusic2">♪ Музика</button>
        <button class="btn small" id="btnPauseMenu">Меню</button>
      </div>
    </div>
  </div>

  <!-- КІНЕЦЬ ГРИ -->
  <div class="overlay" id="ovOver">
    <div class="comment" id="overComment">Тебе з'їли без сметани</div>
    <div class="card">
      <div class="muted-line" id="overLevel">Рівень 1-1</div>
      <div class="bigscore" id="overScore">0</div>
      <div id="overRec"></div>
      <div class="stats" id="overStats"></div>
      <button class="btn big" id="btnAgain">ЩЕ РАЗ</button>
      <button class="btn small" id="btnOverMenu">Меню</button>
    </div>
  </div>
</div>

let actx = null, master = null, noiseBuf = null;
function ensureAudio() {
  try {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      actx = new AC();
      master = actx.createGain();
      master.gain.value = 0.55;
      master.connect(actx.destination);
      noiseBuf = actx.createBuffer(1, actx.sampleRate * 0.6, actx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (actx.state === 'suspended') actx.resume();
  } catch (e) {}
}
function tone(f, dur, type = 'sine', vol = 0.25, f2 = null, delay = 0) {
  if (save.muted || !actx) return;
  const t = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.3, freq = 1200, delay = 0, type = 'lowpass') {
  if (save.muted || !actx || !noiseBuf) return;
  const t = actx.currentTime + delay;
  const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = noiseBuf; f.type = type; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master);
  s.start(t); s.stop(t + dur + 0.02);
}

let musicGain = null, musicOn = false, musicTrack = null, musicNext = 0, musicStep = 0, musicTimer = null;
function startMusic(name) {
  if (!actx) return;
  if (musicOn && musicTrack === name) return;
  musicTrack = name; musicOn = true; musicStep = 0; musicNext = actx.currentTime + 0.08;
  if (!musicGain) { musicGain = actx.createGain(); musicGain.connect(master); }
  const t = actx.currentTime;
  musicGain.gain.cancelScheduledValues(t);
  musicGain.gain.setValueAtTime(0.0001, t);
  musicGain.gain.exponentialRampToValueAtTime(0.5, t + 0.5);
  if (!musicTimer) musicTimer = setInterval(musicTick, 30);
}
function stopMusic() {
  if (!musicOn) return;
  musicOn = false; musicTrack = null;
  if (musicGain && actx) { musicGain.gain.cancelScheduledValues(actx.currentTime); musicGain.gain.setTargetAtTime(0.0001, actx.currentTime, 0.06); }
}
function musicTick() {
  if (!musicOn || !actx) return;
  const T = TRACKS[musicTrack], st = 60 / T.bpm / 4;
  if (musicNext < actx.currentTime - 0.3) musicNext = actx.currentTime + 0.05;   // після паузи вкладки
  while (musicNext < actx.currentTime + 0.15) { playStep(T, musicStep, musicNext, st); musicStep = (musicStep + 1) % 64; musicNext += st; }
}
function mnote(midi, t, dur, type, vol) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(440 * Math.pow(2, (midi - 69) / 12), t);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(musicGain); o.start(t); o.stop(t + dur + 0.02);
}
function mnoise(t, dur, vol, freq, type) {
  const sN = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  sN.buffer = noiseBuf; f.type = type; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  sN.connect(f); f.connect(g); g.connect(musicGain); sN.start(t); sN.stop(t + dur + 0.02);
}
function playStep(T, i, t, st) {
  const bar = Math.floor(i / 16), k = i % 16, ch = T.chords[bar];
  if (k % 4 === 0 || (T.dark && k % 2 === 0)) mnote(T.root - 24 + ch[(!T.dark && k % 8 === 4) ? 2 : 0], t, st * (T.dark ? 1.6 : 3), 'triangle', 0.24);
  if (k % 4 === 2) for (const n of ch) mnote(T.root + n, t, st * 1.2, 'square', 0.022);
  const m = T.mel[i];
  if (m !== null && m !== undefined) mnote(T.root + m, t, st * (T.dark ? 1.3 : 1.8), T.dark ? 'sawtooth' : 'square', T.dark ? 0.035 : 0.045);
  if (k % 8 === 0) {
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
    g.gain.setValueAtTime(0.32, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
    o.connect(g); g.connect(musicGain); o.start(t); o.stop(t + 0.16);
  }
  if (k % 8 === 4) mnoise(t, 0.12, 0.1, 1800, 'bandpass');
  if (k % 2 === 1) mnoise(t, 0.03, 0.035, 7000, 'highpass');
}

const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeOutBack = t => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2);
const lvlName = g => (Math.floor(g / 10) + 1) + '-' + (g % 10 + 1);

function circleRect(cx, cy, r, x, y, w, h) {
  const nx = clamp(cx, x, x + w), ny = clamp(cy, y, y + h);
  const dx = cx - nx, dy = cy - ny;
  return dx * dx + dy * dy < r * r;
}

/* =========================================================
   ПАРАМЕТРИ РІВНЯ (100 рівнів = 10 світів × 10 підрівнів)
   ========================================================= */
function levelParams(g) {
  const w = Math.floor(g / 10), s = g % 10;
  const d = 1 - Math.exp(-g / 32);            // 0 → ~0.95 плавно
  return {
    speed: 255 + 165 * d + s * 1.5,           // px/s, обмежено ~420
    gapMin: lerp(1.15, 0.66, d),              // мін. секунд між хвилями
    gapRand: lerp(0.55, 0.3, d),
    doubleP: clamp(0.06 + g * 0.011, 0, 0.55),// шанс перекрити 2 доріжки
    sideP: g < 2 ? 0 : clamp(0.1 + g * 0.005, 0, 0.32), // летючі ножі
    middleP: 0.28,
    specialP: g < 4 ? 0 : clamp(0.17 + (g - 4) * 0.005, 0, 0.42), // особливі перешкоди
    bonusP: g < 3 ? 0 : 0.09,                 // шанс бонусу у хвилі
    react: lerp(0.85, 0.62, d),               // час на реакцію після стрибка
    creamEvery: 2,                            // сметанка кожні ~2 хвилі
    duration: 30 + w * 1.6 + s * 0.4,         // секунд на підрівень
  };
}

  const dist = Math.abs(LANES[lane] - player.y);
  player.fromY = player.y;
  player.toY = LANES[lane];
  player.lane = lane;
  player.t = 0;
  player.dur = 0.1 + 0.075 * (dist / (LANES[2] - LANES[0]));
  if (lane === 0) SFX.up(); else if (lane === 2) SFX.down(); else SFX.center();

  for (let i = 0; i < 4; i++) addParticle(PX - 30, player.y + rand(-10, 10), rand(-140, -60), rand(-30, 30), rand(3, 6), 'rgba(255,255,255,.8)', 0.3);

  }

window.addEventListener('pointerup', e => {

  if (!touch.done) {
    const dy = e.clientY - touch.y, dx = e.clientX - touch.x;
    const th = Math.max(22, wrap.clientHeight * 0.03);
    if (Math.abs(dy) > th && Math.abs(dy) > Math.abs(dx) * 0.7) moveTo(dy < 0 ? 0 : 2);

  }

window.addEventListener('pointercancel', () => { touch = null; });
document.addEventListener('touchmove', e => { if (!(e.target.closest && e.target.closest('.scroll'))) e.preventDefault(); }, { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

// клавіатура — лише для зручності на ПК
window.addEventListener('keydown', e => {

/* =========================================================
   ГЕНЕРАЦІЯ ХВИЛЬ
   Кожна хвиля перекриває 1 або 2 доріжки — ніколи всі 3.
   Між хвилями завжди є час на реакцію.
   ========================================================= */
function spawnWave() {
  waveCount++;
  waveExtra = 0;

  // ОСОБЛИВА ПЕРЕШКОДА: завжди окрема хвиля зі своїм попередженням і запасом часу.
  if (event && event.kind === 'rain') return rainWave();
  if (event && event.kind === 'horde') return hordeWave();
  if (waveCount > 2 && Math.random() < P.specialP) {
    const avail = Object.keys(UNLOCK).filter(k => level >= UNLOCK[k]);
    const wi = Math.floor(level / 10);
    if (wi === 1 || wi === 4) avail.push('steam', 'steam');    // плита / духовка
    if (avail.length) {
      let tot = 0;
      const ws = avail.map(k => { const w = level - UNLOCK[k] < 3 ? 3 : 1; tot += w; return w; }); // новинки — частіше
      let r = Math.random() * tot, k = avail[0];
      for (let i = 0; i < avail.length; i++) { r -= ws[i]; if (r <= 0) { k = avail[i]; break; } }
      if (OB_NAMES[k] && !save.seen[k]) { save.seen[k] = 1; persist(); showBanner('НОВЕ: ' + OB_NAMES[k], OB_HINTS[k], '#ff9f6b', 2.4); }
      return SPAWN[k]();
    }
  }
  // скільки доріжок закрити
  let blockCount = Math.random() < P.doubleP ? 2 : 1;
  // вибір вільних доріжок
  let blocked = [false, false, false];
  if (blockCount === 1) {
    // частіше закриваємо ту доріжку, де гравець зараз (щоб змушувати рухатись)
    let l = Math.random() < 0.55 ? player.lane : randi(0, 2);
    blocked[l] = true;
  } else {
    const free = randi(0, 2);
    for (let i = 0; i < 3; i++) blocked[i] = i !== free;
  }
  const freeLanes = [0, 1, 2].filter(i => !blocked[i]);

  let width = 0;
  const x = SPAWN_X;
  const useSide = Math.random() < P.sideP;

  if (blocked[0] && blocked[1] && !blocked[2]) {
    // довгий ніж/виделка зверху на 2 доріжки
    width = addVertical('top', 2, x);
  } else if (!blocked[0] && blocked[1] && blocked[2]) {
    width = addVertical('bottom', 2, x);
  } else {
    // окремо по доріжках
    if (blocked[0]) width = Math.max(width, (useSide ? addSide(0, x) : addVertical('top', 1, x)));
    if (blocked[2]) width = Math.max(width, (useSide && !blocked[0] ? addSide(2, x) : addVertical('bottom', 1, x)));
    if (blocked[1]) width = Math.max(width, (useSide && !blocked[0] && !blocked[2]) ? addSide(1, x) :
      (Math.random() < 0.5 ? addMiddle(x) : addSide(1, x, true)));
  }

  // сметанка
  let creamLane = -1;
  if (waveCount % P.creamEvery === 0 || Math.random() < 0.25) {
    const l = pick(freeLanes);
    creamLane = l;
    const n = Math.random() < 0.3 ? 3 : 1;
    for (let i = 0; i < n; i++) creams.push({ x: x + i * 55, y: LANES[l], lane: l, got: false, missed: false, bob: Math.random() * 6 });
  }
  // бонус
  if (P.bonusP > 0 && !power && pickups.length === 0 && Math.random() < P.bonusP) spawnPickup(x, freeLanes, creamLane);
  lastFree = freeLanes[0];
  return width;
}

function addVertical(from, span, x, jumper, forceKind) {
  // from: 'top' | 'bottom'; span: 1 або 2 доріжки
  const kind = forceKind || (from === 'top' ? (Math.random() < 0.65 ? 'knife' : 'fork') : (Math.random() < 0.65 ? 'fork' : 'knife'));
  const reach = span === 1 ? LANE_H - 26 : LANE_H * 2 - 26;
  const w = kind === 'knife' ? (span === 1 ? 40 : 46) : (span === 1 ? 44 : 52);
  const L = reach + 20; // +20 — частина, що встромлена у стіл
  const o = {
    type: 'vert', kind, x, w, reach, L,
    down: from === 'top',                         // вістря дивиться вниз
    baseY: from === 'top' ? FIELD_TOP - 20 : FIELD_BOT + 20,
    tipIn: false, wob: Math.random() * 6, quiver: 0,
    jumper: !!jumper, jumpT: -1, jumpX: 0, fromY: 0, toY: 0,
  };
  if (jumper) {
    o.jumpX = Math.min(W - 40, PX + w / 2 + HIT_R + Math.max(speed, targetSpeed) * P.react);
    o.toY = o.down ? FIELD_BOT - reach : FIELD_TOP + reach;
  }
  obstacles.push(o);
  return w;
}
function addMiddle(x) {
  const kind = Math.random() < 0.5 ? 'pin' : 'grater';
  const w = kind === 'pin' ? 150 : 96;
  const h = kind === 'pin' ? 46 : 110;
  obstacles.push({ type: 'mid', kind, x, w, h, y: LANES[1], rot: 0, passed: false });
  return w;
}
function addSide(lane, x, forceSlow) {
  // летючий ніж: з'являється попередження, потім ніж влітає швидше за потік,
  // але прибуває до пельменя рівно тоді, коли прибула б звичайна перешкода.
  const wi = Math.floor(level / 10);
  const tray = (wi === 6 || wi === 7) && Math.random() < 0.6;   // ресторан / їдальня: таця
  obstacles.push({ type: 'side', lane, vx: x, x: W + 200, launched: false, w: 150, h: 26, passed: false, spin: 0, tray,
    k: tray ? 1.4 : (forceSlow ? 1.5 : SIDE_K) });
  return 150;
}

/* =========================================================
   ЧАСТИНКИ / НАПИСИ
   ========================================================= */
function addParticle(x, y, vx, vy, r, color, life, grav = 0, shape = 0) {
  if (particles.length > 160) particles.shift();
  particles.push({ x, y, vx, vy, r, color, life, max: life, grav, shape, rot: Math.random() * 6, vr: rand(-8, 8) });
}
function addPopup(text, x, y, color = '#fff', size = 26, life = 0.9) {
  popups.push({ text, x, y, color, size, life, max: life });
}

/* =========================================================
   ОНОВЛЕННЯ
   ========================================================= */
function update(dt) {
  time += dt;

  // анімації пельменя, що йдуть завжди
  player.nextBlink -= dt;
  if (player.nextBlink <= 0) { player.blink = 0.13; player.nextBlink = rand(1.8, 4); }
  if (player.blink > 0) player.blink -= dt;
  if (player.happy > 0) player.happy -= dt;

  if (banner) { banner.t += dt; if (banner.t > banner.dur) banner = null; }
  if (toasts.length) { toasts[0].t += dt; if (toasts[0].t > toasts[0].dur) toasts.shift(); }
  if (shake > 0) shake = Math.max(0, shake - dt * 2.5);
  if (flash > 0) flash = Math.max(0, flash - dt * 3);

  updateParticles(dt);
  updateAmb(dt);

  if (state === 'menu') {
    // пельмень у меню просто стрибає між доріжками
    speed = 120; bgScroll += speed * dt * 0.3; lineScroll += speed * dt;
    const yy = LANES[1] + Math.sin(time * 1.7) * 12;
    player.squash = Math.sin(time * 3.4) * 0.05;
    player.y = yy;
    return;
  }
  if (state === 'paused' || state === 'over') return;

  if (state === 'dying') {
    deathT += dt;
    speed = Math.max(0, speed - speed * dt * 6);
    player.splat = Math.min(1, player.splat + dt * 7);
    for (const o of obstacles) moveObstacle(o, dt);
    for (const c of creams) c.x -= speed * dt;
    if (deathT > 1.15) showGameOver();
    return;
  }

  // ---- PLAY ----
  if (countdown > 0) {
    const before = Math.ceil(countdown);
    countdown -= dt;
    if (Math.ceil(countdown) !== before && countdown > 0) SFX.tick();
    return;
  }

  speed += (targetSpeed * speedMul - speed) * Math.min(1, dt * 1.5);
  const dx = speed * dt;
  if (!tut) traveled += dx;
  bgScroll += dx * 0.3;
  lineScroll += dx;

  // очки за виживання
  if (!tut) scoreF += dt * 10 * (1 + level * 0.03) * scoreMul();
  const ns = Math.floor(scoreF);
  if (ns !== score) score = ns;

  // рух пельменя
  if (player.t < 1) {
    player.t = Math.min(1, player.t + dt / player.dur);
    const ny = lerp(player.fromY, player.toY, isSlippery() ? easeOutBack(player.t) : easeOut(player.t));
    player.vy = (ny - player.y) / Math.max(dt, 0.001);
    player.y = ny;
  } else {
    player.vy *= 0.8;
    player.y = player.toY + Math.sin(time * 6) * 2.5; // легке «дихання»
  }
  player.squash += (clamp(Math.abs(player.vy) / 3200, 0, 0.28) - player.squash) * Math.min(1, dt * 18);

  // спавн хвиль
  const remaining = levelDist - traveled;
  const prog = traveled / levelDist;
  if (bossPlan !== null && !boss && !bossPending && !bossDone && prog >= bossPlan) {
    bossPending = true;
    showBanner('УВАГА!', 'щось велике наближається…', '#ff4d4d', 1.8);
  }
  if (eventPlan && !event && prog >= eventPlan.at) { startEvent(eventPlan.kind); eventPlan = null; }
  if (tut) updateTut(dt);
  const paused = tut || bossPending || boss || (event && event.kind === 'mom');
  if (paused) sinceLast = 0;
  else if (!levelEnding) {
    sinceLast += dt;
    if (sinceLast >= nextGap) {
      if (remaining > (SPAWN_X - PX) + speed * 0.4 || isBossLevel(level)) {
        const width = spawnWave();
        sinceLast = 0;
        // час, поки ця хвиля повністю пройде + чистий проміжок на реакцію
        const f = event && event.kind === 'horde' ? 0.72 : (event && event.kind === 'rain' ? 0.85 : 1);
        nextGap = (width + HIT_R * 2) / speed + Math.max(0.5, P.gapMin * f) + Math.random() * P.gapRand * f + waveExtra;
      } else {
        levelEnding = true;
      }
    }
  }
  if (bossPending && obstacles.every(o => o.dead || obPast(o))) spawnBoss();
  if (boss) updateBoss(dt);
  if (event) updateEvent(dt);
  momDark += ((event && event.kind === 'mom' && event.phase !== 'wait' ? 1 : 0) - momDark) * Math.min(1, dt * 3);
  achTick -= dt;
  if (achTick <= 0) { achTick = 0.5; checkRunAch(); }

  // перешкоди
  let nearest = 9999;
  const chili = power && (power.kind === 'chili' || power.kind === 'super');
  for (const o of obstacles) {
    moveObstacle(o, dt);
    if (o.dead) continue;
    if (hitTest(o)) {
      if (o.tut) { smash(o, 'tut'); if (tut) { tut.step = 4; tut.wait = 0; tut.spawned = false; } addPopup('Ой! Ще раз — ухиляйся', PX + 60, player.y - 60, '#ffffff', 20); continue; }
      if (chili) { smash(o, 'chili'); continue; }
      if (invuln > 0) continue;
      if (shield) { shield = false; invuln = 0.9; smash(o, 'butter'); continue; }
      die(o); return;
    }
    // крижаний муляж: виделки, що цілили в нього, «наколюють» копію
    if (decoy && !o.hitDecoy && (o.type === 'hunter' || o.type === 'shooter') &&
        circleHitsShapes(PX - 6, LANES[decoy.lane] + 4, 30, obstacleShapes(o))) { o.hitDecoy = true; decoyHit(); }
    // «ледь не»: запам'ятовуємо найменшу відстань, рахуємо один раз, коли перешкода пройшла
    if (!o.nmDone) {
      if (o.nmMin === undefined) o.nmMin = Infinity;
      const gp = shapeGap(o);
      if (gp < o.nmMin) o.nmMin = gp;
      // ризик: перешкода у твоїй доріжці і до удару менше ~0.25 с
      if (!o.risk) {
        const f = frontDist(o);
        if (f > -10 && f < 9000 && threatensLane(o, laneOfY(player.y)) && f / obSpeed(o) < 0.25) o.risk = true;
      }
      if (obPast(o)) {
        o.nmDone = true;
        if ((o.nmMin < NEAR || o.risk) && invuln <= 0 && !chili) nearMiss(o);
      }
    }
    const front = frontDist(o);
    if (front > -20 && front < nearest && threatensLane(o, player.lane)) nearest = front;
  }
  obstacles = obstacles.filter(o => !obGone(o));

  player.scared = nearest < 150 ? 1 : 0;
  player.look = nearest < 280 ? 1 : 0;

  // мильні бульбашки
  for (const q of bubbles) {
    q.x -= dx * 0.85; q.y += Math.sin(time * 2 + q.ph) * 0.4;
    if (!q.got) {
      const ddx = q.x - PX, ddy = q.y - player.y;
      if (ddx * ddx + ddy * ddy < (HIT_R + q.r) * (HIT_R + q.r)) {
        q.got = true; SFX.pop(); addScore(5 * scoreMul()); addPopup('+' + 5 * scoreMul(), q.x, q.y - 26, '#bfefff', 18, 0.6);
        for (let i = 0; i < 8; i++) addParticle(q.x, q.y, rand(-150, 150), rand(-150, 150), rand(2, 4), 'rgba(220,245,255,.9)', 0.35, 0);
      }
    }
  }
  bubbles = bubbles.filter(q => !q.got && q.x > -30);
  if (Math.floor(level / 10) === 3 && !tut && !boss && Math.random() < dt * 0.9 && bubbles.length < 6)
    bubbles.push({ x: W + 30, y: LANES[randi(0, 2)] + rand(-30, 30), r: rand(12, 18), ph: rand(0, 6), got: false });

  // бонуси на полі
  for (const b of pickups) {
    b.x -= dx;
    if (!b.got) {
      const ddx = b.x - PX, ddy = b.y - player.y;
      if (ddx * ddx + ddy * ddy < (HIT_R + 26) * (HIT_R + 26)) collectBonus(b);
    }
  }
  pickups = pickups.filter(b => !b.got && b.x > -50);

  // таймери ефектів
  if (power) {
    power.t -= dt;
    if (power.kind === 'chili' && Math.random() < dt * 14)
      addParticle(PX + rand(-24, 24), player.y - 44, rand(-20, 20), rand(-130, -70), rand(4, 8), 'rgba(255,255,255,.75)', 0.6, -60);
    if (power.kind === 'gold' && Math.random() < dt * 10)
      addParticle(PX + rand(-40, 40), player.y + rand(-40, 30), 0, rand(-40, -10), rand(2, 4), '#fff3a0', 0.6, 0, 1);
    if (power.t <= 0) endPower(false);
  }
  if (invuln > 0) invuln -= dt;
  if (nmTimer > 0) { nmTimer -= dt; if (nmTimer <= 0) nmStreak = 0; }

  // сметанка
  for (const c of creams) {
    c.x -= dx;
    if (!c.got && !c.missed) {
      const ddx = c.x - PX, ddy = c.y - player.y;
      if (ddx * ddx + ddy * ddy < (HIT_R + 22) * (HIT_R + 22)) collectCream(c);
      else if (c.x < PX - HIT_R - 26) { c.missed = true; if (c.rain) continue; if (combo >= 3) addPopup('комбо згоріло', PX + 30, c.y - 30, '#ffffffaa', 18); combo = 0; }
    }
  }
  creams = creams.filter(c => c.x > -40 && !c.got);

  // кінець підрівня
  if (levelEnding && !isBossLevel(level) && !event && traveled >= levelDist && obstacles.every(o => o.dead || obPast(o))) {
    completeLevel();
  }
}

function moveObstacle(o, dt) {
  if (o.dead) {
    o.deadT += dt; o.fx += o.fvx * dt; o.fy += o.fvy * dt; o.fvy += 1300 * dt; o.fr += o.fvr * dt;
    return;
  }
  if (OBT[o.type]) { OBT[o.type].move(o, dt); return; }
  if (o.type === 'side') {
    o.vx -= speed * dt;
    if (!o.launched) {
      if ((o.vx - PX) * o.k <= (W + 80 - PX)) { o.launched = true; o.x = W + 80; }
    } else {
      o.x -= speed * o.k * dt;
      o.spin += dt;
    }
  } else {
    o.x -= speed * dt;
    if (o.type === 'mid' && o.kind === 'pin') o.rot += dt * speed / 23;
    if (o.type === 'vert') {
      if (o.jumper && o.jumpT < 0 && o.x <= o.jumpX) { o.jumpT = 0; o.fromY = o.baseY; SFX.jump(); }
      if (o.jumpT >= 0 && o.jumpT < 1) {
        o.jumpT = Math.min(1, o.jumpT + dt / 0.22);
        o.baseY = lerp(o.fromY, o.toY, o.jumpT * o.jumpT);
        if (o.jumpT >= 1) {
          o.tipIn = true; o.quiver = 1;
          SFX.thunk();
          shake = Math.max(shake, 0.22);
          const ty = o.down ? FIELD_BOT : FIELD_TOP;
          const col = WORLDS[Math.floor(level / 10)].line;
          for (let i = 0; i < 8; i++) addParticle(o.x + rand(-10, 10), ty, rand(-160, 160), (o.down ? -1 : 1) * rand(80, 260), rand(2.5, 5), i % 2 ? col : '#ffffff', 0.45, o.down ? 600 : -600, 1);
        }
      }
      if (o.quiver > 0) o.quiver = Math.max(0, o.quiver - dt * 2.2);
    }
  }
}
function vertRange(o) { return o.down ? [o.baseY, o.baseY + o.L] : [o.baseY - o.L, o.baseY]; }

function obstacleRects(o) {
  if (o.type === 'vert') {

    const r = vertRange(o);
    return [[o.x - hw, r[0], hw * 2, r[1] - r[0]]];
  }
  if (o.type === 'mid') {
    if (o.kind === 'pin') return [[o.x - o.w / 2 + 10, o.y - o.h / 2 + 4, o.w - 20, o.h - 8]];
    return [[o.x - o.w / 2 + 6, o.y - o.h / 2 + 6, o.w - 12, o.h - 12]];
  }
  if (o.type === 'side') {
    if (!o.launched) return [];

    return [[o.x - o.w / 2 + 6, y - o.h / 2 + 3, o.w - 30, o.h - 6]];
  }

}
// Форми для зіткнень: ['r', x, y, w, h] — прямокутник, ['c', x, y, r] — коло
function obstacleShapes(o) {
  if (o.dead) return [];
  if (OBT[o.type]) return OBT[o.type].shapes(o);
  return obstacleRects(o).map(r => ['r', r[0], r[1], r[2], r[3]]);
}
function circleHitsShapes(cx, cy, r, shapes) {
  for (const s of shapes) {
    if (s[0] === 'r') { if (circleRect(cx, cy, r, s[1], s[2], s[3], s[4])) return true; }
    else { const dx = cx - s[1], dy = cy - s[2], rr2 = r + s[3]; if (dx * dx + dy * dy < rr2 * rr2) return true; }
  }
  return false;
}
function hitTest(o) { return circleHitsShapes(PX, player.y + 4, HIT_R, obstacleShapes(o)); }
// відстань від краю пельменя до перешкоди (для «ледь не»)
function shapeGap(o) {
  const cx = PX, cy = player.y + 4;
  let m = Infinity;
  for (const s of obstacleShapes(o)) {
    let d;
    if (s[0] === 'r') { const nx = clamp(cx, s[1], s[1] + s[3]), ny = clamp(cy, s[2], s[2] + s[4]); d = Math.hypot(cx - nx, cy - ny) - HIT_R; }
    else d = Math.hypot(cx - s[1], cy - s[2]) - s[3] - HIT_R;
    if (d < m) m = d;

}
function frontDist(o) {
  if (OBT[o.type]) return OBT[o.type].front(o);
  if (o.type === 'side') return o.launched ? o.x - 75 - PX : 9999;
  return o.x - o.w / 2 - PX;
}
function obPast(o) {
  if (OBT[o.type]) return OBT[o.type].past(o);
  if (o.type === 'side') return o.launched && o.x + 75 < PX - HIT_R;
  return o.x + o.w / 2 < PX - HIT_R;
}
function obGone(o) {

}
function threatensLane(o, lane) {
  if (o.dead) return false;

  if (o.type === 'vert') {
    const r = vertRange(o);
    return r[1] > LANES[lane] - HIT_R && r[0] < LANES[lane] + HIT_R;
  }
  if (o.type === 'mid') return lane === 1;
  if (o.type === 'side') return lane === o.lane;
  return false;
}

/* =========================================================
   ОСОБЛИВІ ПЕРЕШКОДИ
   Кожна — окрема хвиля. Правило чесності: остаточна доріжка удару стає
   відомою щонайменше за P.react секунд, і хоча б одна доріжка вільна.

const vmax = () => Math.max(speed, targetSpeed);

const SH_MX = W - 104;   // звідки вилітає зубець виделки-стрільця

function panY(o, x) {
  const a = PX + 150, b = W + 80;
  const t = clamp((x - a) / (b - a), 0, 1), k = t * t * (3 - 2 * t);
  return LANES[o.B] + (LANES[o.A] - LANES[o.B]) * k;
}
function spoonDir(o) { const a = o.top ? -o.raise : Math.PI + o.raise; return [-Math.sin(a), Math.cos(a), a]; }
function spoonPivotY(o) { return o.top ? FIELD_TOP - 10 : FIELD_BOT + 10; }

const SPAWN = {
  steam() {
    obstacles.push({ type: 'steam', x: SPAWN_X, popped: false, popT: 0, span: 1, wob: Math.random() * 6,
      popX: Math.min(W - 50, PX + 36 + HIT_R + vmax() * P.react) });
    waveExtra = 0.3;
    return 70;
  },
  jumper() {
    const from = Math.random() < 0.5 ? 'top' : 'bottom';
    const span = Math.random() < clamp((level - 8) * 0.02, 0, 0.4) ? 2 : 1;
    const lead = 0.4;
    const x = SPAWN_X + vmax() * lead;
    const w = addVertical(from, span, x, true);
    if (span === 1 && Math.random() < 0.6) creams.push({ x: x, y: LANES[1], lane: 1, got: false, missed: false, bob: Math.random() * 6 });
    waveExtra = lead + 0.3;
    return w;
  },
  shooter() {
    const lane = decoy ? decoy.lane : (Math.random() < 0.6 ? player.lane : randi(0, 2));
    const lead = 0.5;
    obstacles.push({ type: 'shooter', lane, vx: SPAWN_X + vmax() * lead, x: W + 90, fired: false, aiming: false, urg: 0, px: 0, t: 0, recoil: 0, wob: Math.random() * 6 });
    waveExtra = lead + 0.25;
    return 50;
  },
  pan() {
    const A = randi(0, 2);
    let B = randi(0, 2);
    if (B === A && Math.random() < 0.75) B = (A + (Math.random() < 0.5 ? 1 : 2)) % 3;
    const lead = 0.45;
    obstacles.push({ type: 'pan', A, B, vx: SPAWN_X + vmax() * lead, x: W + 200, launched: false, k: 1.7, rot: 0 });
    waveExtra = lead + 0.25;
    return 70;
  },
  toaster() {
    obstacles.push({ type: 'toaster', x: SPAWN_X, popped: false, popT: 0, tl: 0, ty: FIELD_BOT - 118, fromY: 0, toY: 0,
      popX: Math.min(W - 50, PX + 46 + HIT_R + vmax() * P.react), wob: Math.random() * 6 });
    waveExtra = 0.3;
    return 92;
  },
  hunter() {
    const tl = targetLane();
    const lead = 0.6;
    obstacles.push({ type: 'hunter', x: SPAWN_X + vmax() * lead, y: LANES[tl], tl, re: 0.3, locked: false, flash: 0,
      lockX: PX + 60 + HIT_R + vmax() * (P.react + 0.3) });
    waveExtra = lead + 0.3;
    return 120;
  },
  boom() {
    const A = Math.random() < 0.6 ? player.lane : randi(0, 2);

    obstacles.push({ type: 'boom', A, B, vx: SPAWN_X, x: W + 200, y: LANES[A], phase: 0, t: 0, k: 1.8, vb: 0, rot: 0 });
    waveExtra = 1.15;   // поки летить туди й назад, інших хвиль немає
    return 60;
  },
  spoon() {
    obstacles.push({ type: 'spoon', top: Math.random() < 0.5, x: SPAWN_X + 30, raise: 1.25, swingT: -1, span: 2,
      L: LANE_H * 2 - 16, quiver: 0, swingX: Math.min(W - 30, PX + 30 + HIT_R + vmax() * P.react), wob: Math.random() * 6 });
    waveExtra = 0.3;

  },
};

const OBT = {

        for (const k of [-4, 4]) { ctx.beginPath(); ctx.moveTo(30, k); ctx.lineTo(80, k); ctx.stroke(); }

        ctx.restore();
      }

      ctx.save();
      ctx.translate(o.x + 60 + o.recoil * 14, by);
      ctx.rotate(-Math.PI / 2);

  // ---- ЛІТАЮЧА СКОВОРІДКА: летить по показаному пунктиру з доріжки A у доріжку B ----
  pan: {

    front(o) { return o.launched ? o.x - 30 - PX : 9999; },

        ctx.stroke(); ctx.setLineDash([]);
        const ey = LANES[o.B];
        ctx.fillStyle = '#ff2d2d';
        ctx.beginPath(); ctx.moveTo(PX - 50, ey); ctx.lineTo(PX - 30, ey - 11); ctx.lineTo(PX - 30, ey + 11); ctx.closePath(); ctx.fill();
        ctx.restore();
      }

    },
  },

  // ---- ТОСТЕР: стоїть на столі (нижня доріжка), «дзинь» — і тост вистрибує вгору ----
  toaster: {
    move(o, dt) {
      o.x -= speed * dt;
      if (!o.popped && o.x <= o.popX) {
        o.popped = true; o.popT = 0;
        const tl = targetLane();
        o.tl = tl === 2 ? randi(0, 1) : tl;
        o.fromY = o.ty; o.toY = LANES[o.tl];

        else o.ty = o.toY + Math.sin(time * 4 + o.wob) * 3;

    },
    shapes(o) { return [['r', o.x - 42, FIELD_BOT - 112, 84, 112], ['r', o.x - 26, o.ty - 23, 52, 46]]; },
    threat(o, lane) { return !this.past(o) && (lane === 2 || (o.popped && lane === o.tl)); },
    front(o) { return o.x - 46 - PX; },
    past(o) { return o.x + 46 < PX - HIT_R; },
    gone(o) { return o.x < -150; },
    draw(o) {
      drawToaster(o);
      if (!o.popped && !o.dead && o.x < W + 20) drawMarker(o.x - 78, LANES[1], -1);
    },
  },

  // ---- ВИДЕЛКА-МИСЛИВЕЦЬ: підлаштовується під твою доріжку, потім «клац» — і фіксується ----
  hunter: {
    move(o, dt) {
      o.x -= speed * dt;
      if (!o.locked) {
        o.re -= dt;
        if (o.re <= 0) { o.re = 0.3; o.tl = targetLane(); }
        if (o.x <= o.lockX) { o.locked = true; o.flash = 1; SFX.lock(); }
      }

    shapes(o) { return [['r', o.x - 60, o.y - 15, 112, 30]]; },
    threat(o, lane) { return !this.past(o) && lane === o.tl; },
    front(o) { return o.x - 60 - PX; },
    past(o) { return o.x + 52 < PX - HIT_R; },
    gone(o) { return o.x < -150; },
    warn(o) { if (o.x - 60 > W - 24) drawCrosshair(W - 34, o.y, o.locked); },
    draw(o) {

  // ---- НІЖ-БУМЕРАНГ: пролітає доріжкою A, розвертається і повертається ззаду доріжкою B ----
  boom: {
    move(o, dt) {
      o.vx -= speed * dt; o.rot += dt * 16;
      if (o.phase === 0) {
        if ((o.vx - PX) * o.k <= (W + 80 - PX)) { o.phase = 1; o.x = W + 80; o.vb = Math.max(speed * o.k, 300); SFX.whoosh(); }
      } else if (o.phase === 1) {

        o.x = -70 - 40 * Math.sin(Math.PI * u);

    shapes(o) { return o.phase >= 1 ? [['c', o.x, o.y, 28]] : []; },
    threat(o, lane) {

    },
    front(o) { return o.phase === 1 ? o.x - 28 - PX : (o.phase === 3 ? PX - o.x - 28 : 9999); },
    past(o) { return o.phase === 3 && o.x - 28 > PX + HIT_R; },
    gone(o) { return o.phase === 3 && o.x > W + 150; },
    warn(o) {

    },
    draw(o) {
      if (o.phase < 1) return;
      ctx.save();
      ctx.translate(o.x, o.y);
      ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(0, 0, 46, o.rot + 0.5, o.rot + 1.6); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, 46, o.rot + 3.6, o.rot + 4.7); ctx.stroke();
      ctx.rotate(o.rot);
      ctx.translate(0, 50);
      drawUtensil('knife', 100, 26, true);
      ctx.restore();
    },
  },

  // ---- ВЕЛИКА ЛОЖКА: замахується і черпає твою доріжку ----
  spoon: {
    move(o, dt) {
      o.x -= speed * dt;
      if (o.swingT < 0 && o.x <= o.swingX) {
        o.swingT = 0;
        const tl = targetLane();
        o.span = o.top ? (tl === 0 ? 1 : 2) : (tl === 2 ? 1 : 2);
        o.L = o.span * LANE_H - 16;
        SFX.swoosh();
      }
      if (o.swingT >= 0 && o.swingT < 1) {
        o.swingT = Math.min(1, o.swingT + dt / 0.24);
        o.raise = 1.25 * (1 - o.swingT * o.swingT);
        if (o.swingT >= 1) { o.quiver = 1; shake = Math.max(shake, 0.15); }
      }
      if (o.quiver > 0) o.quiver = Math.max(0, o.quiver - dt * 2.5);
    },
    shapes(o) {
      const d = spoonDir(o), px = o.x, py = spoonPivotY(o), out = [];
      for (let k = 6; k < o.L - 56; k += 16) out.push(['c', px + d[0] * k, py + d[1] * k, 7]);
      out.push(['c', px + d[0] * (o.L - 28), py + d[1] * (o.L - 28), 24]);
      return out;
    },
    threat(o, lane) {
      if (this.past(o) || o.swingT < 0) return false;
      const y0 = o.top ? FIELD_TOP : FIELD_BOT - o.L, y1 = o.top ? FIELD_TOP + o.L : FIELD_BOT;
      return y1 > LANES[lane] - HIT_R && y0 < LANES[lane] + HIT_R;
    },
    front(o) { return o.swingT >= 0 ? o.x - 28 - PX : 9999; },
    past(o) { return o.x + 30 < PX - HIT_R; },
    gone(o) { return o.x < -100; },
    draw(o) {
      drawSpoon(o);
      if (o.swingT < 0 && !o.dead && o.x < W + 10) drawMarker(o.x - 40, LANES[1], o.top ? 1 : -1);
    },
  },
};

   ПОДІЇ

const laneOfY = y => y < B1 ? 0 : (y < B2 ? 1 : 2);
function obSpeed(o) {
  if (o.type === 'side' || o.type === 'pan') return Math.max(speed * o.k, 1);
  if (o.type === 'boom') return o.vb || Math.max(speed * o.k, 1);
  if (o.type === 'shooter') return o.fired ? SH_PS : Math.max(speed, 1);
  if (o.type === 'bshot') return 1000;
  if (o.type === 'sweep' || o.type === 'bthrust') return 700;
  if (o.type === 'bchop') return 1000;
  return Math.max(speed, 1);
}
function startEvent(kind) {
  const E = EVENTS[kind];
  save.seen['ev_' + kind] = 1; persist();
  SFX.event();
  showBanner(E.name, E.sub, kind === 'mom' ? '#ffb4c6' : '#ffd166', 2.2);
  if (kind === 'super') {
    if (power) endPower(true);
    power = { kind: 'super', t: E.dur, dur: E.dur };
    event = { kind, t: E.dur, dur: E.dur };
  } else if (kind === 'mom') {
    SFX.mom();
    event = { kind, phase: 'wait', left: 3 + (level >= 50 ? 1 : 0), t: 0.8 };
  } else event = { kind, t: E.dur, dur: E.dur };
}
function updateEvent(dt) {
  if (event.kind === 'mom') {
    if (event.phase === 'wait') {
      if (obstacles.every(o => o.dead || obPast(o))) event.phase = 'go';
      return;
    }
    const active = obstacles.some(o => o.type === 'sweep');
    if (active) return;
    event.t -= dt;
    if (event.t > 0) return;
    if (event.left > 0) {
      event.left--;
      obstacles.push({ type: 'sweep', lane: targetLane(), warn: Math.max(0.8, 1.0 - level * 0.002), t: 0, ph: 0, hx: W + 160 });
      event.t = 0.35;
    } else {
      event = null;
      unlock('mom');
      addScore(100 * scoreMul());
      showBanner('МАМА ПІШЛА', 'фух… +100', '#ffffff', 1.4);
    }
    return;
  }
  event.t -= dt;
  if (event.kind === 'super' && (!power || power.kind !== 'super')) { event = null; return; }
  if (event.t <= 0) event = null;
}
function rainWave() {
  const x = SPAWN_X;
  let width = 40, blocked = -1;
  if (Math.random() < 0.5) {
    blocked = randi(0, 2);
    width = blocked === 1 ? addMiddle(x) : addVertical(blocked === 0 ? 'top' : 'bottom', 1, x);
  }
  for (const l of [0, 1, 2]) {
    if (l === blocked || Math.random() < 0.25) continue;
    for (let i = 0; i < 2; i++) creams.push({ x: x + i * 55 + rand(-10, 10), y: LANES[l], lane: l, got: false, missed: false, bob: Math.random() * 6, rain: true });
  }
  return width;
}
function hordeWave() {
  const l = Math.random() < 0.6 ? player.lane : randi(0, 2);
  if (l === 1) return addVertical(Math.random() < 0.5 ? 'top' : 'bottom', 2, SPAWN_X, false, 'fork');
  return addVertical(l === 0 ? 'top' : 'bottom', 1, SPAWN_X, false, 'fork');
}

/* =========================================================
   БОСИ: треба вистояти N атак. Кожна атака має попередження
   щонайменше ~0.75 с і завжди лишає вільну доріжку.
   ========================================================= */
function bossWarn() { return Math.max(0.75, 1.05 - (boss ? boss.w : 0) * 0.03); }
function spawnBoss() {
  bossPending = false;
  const w = Math.floor(level / 10);
  const kind = BOSS_BY_WORLD[w];
  const hp = kind === 'chef' ? 12 : 6 + Math.min(4, Math.floor(w / 2));
  boss = { kind, w, hp, maxHp: hp, phase: 'enter', t: 0, x: W + 160, atk: 0, busy: false, cd: 0.6, lunge: 0, hurt: 0 };
  SFX.boss(); shake = Math.max(shake, 0.8);
  showBanner('БОС: ' + BOSS_NAMES[kind], 'вистояти ' + hp + ' атак', '#ff6b6b', 2.4);
}
function updateBoss(dt) {
  const b = boss;
  b.t += dt;
  if (b.lunge > 0) b.lunge = Math.max(0, b.lunge - dt * 2.5);
  if (b.hurt > 0) b.hurt = Math.max(0, b.hurt - dt * 2);
  if (b.phase === 'enter') {
    b.x = lerp(W + 160, W - 46, easeOut(Math.min(1, b.t / 1.2)));
    if (b.t >= 1.4) { b.phase = 'fight'; b.t = 0; }
    return;
  }
  if (b.phase === 'dying') {
    b.x += dt * 260;
    if (Math.random() < dt * 30) addParticle(W - 60 + rand(-40, 40), rand(FIELD_TOP, FIELD_BOT), rand(-200, 100), rand(-300, 100), rand(3, 7), pick(['#ffd166', '#ffffff', '#ff6f59']), 0.8, 500, 1);
    if (b.t >= 2.2) {
      boss = null; bossDone = true;
      completeLevel();
    }
    return;
  }
  // бій
  if (b.busy) {
    if (!obstacles.some(o => o.boss)) {
      b.busy = false; b.hp--; b.hurt = 1; b.cd = 0.8;
      SFX.bossHit();
      addPopup(pick(['ПРОМАХ!', 'МИМО!', 'НЕ ВЛУЧИВ!', 'ХА!']), W - 130, FIELD_TOP + 60, '#ffd166', 24);
      const cl = randi(0, 2);
      creams.push({ x: W - 110, y: LANES[cl], lane: cl, got: false, missed: false, bob: Math.random() * 6, rain: true });
      if (b.hp <= 0) {
        b.phase = 'dying'; b.t = 0;
        const reward = 300 * (b.w + 1);
        addScore(reward);
        SFX.win(); shake = Math.max(shake, 0.7);
        showBanner('ПЕРЕМОГА!', BOSS_NAMES[b.kind] + ' тікає! +' + reward, '#ffd166', 2.2);
        save.bossWins[b.w] = 1; persist();
        unlock('boss1');
        if (Object.keys(save.bossWins).length >= 10) unlock('boss10');
      }
    }
    return;
  }
  b.cd -= dt;
  if (b.cd <= 0) { bossAttack(); b.busy = true; }
}
function pairLanes() {
  const tl = targetLane();
  return tl === 1 ? (Math.random() < 0.5 ? [0, 1] : [1, 2]) : (tl === 0 ? [0, 1] : [1, 2]);
}
function pressSetup(o) {
  const tl = targetLane();
  if (tl === 0) { o.top = true; o.span = randi(1, 2); }
  else if (tl === 2) { o.top = false; o.span = randi(1, 2); }
  else { o.top = Math.random() < 0.5; o.span = 2; }
}
function chopSetup(o) {
  const tl = targetLane();
  if (tl === 0) { o.top = true; o.span = Math.random() < 0.5 ? 1 : 2; }
  else if (tl === 2) { o.top = false; o.span = Math.random() < 0.5 ? 1 : 2; }
  else { o.top = Math.random() < 0.5; o.span = 2; }
  o.x = PX;
}
function bossAttack() {
  const k = boss.kind, w = boss.w, warn = bossWarn(), i = boss.atk++;
  const pushBase = o => { o.boss = true; o.vis = k; o.warn = warn; o.t = 0; o.ph = 0; obstacles.push(o); };
  const nShots = 3 + Math.min(2, Math.floor(w / 3));
  const a = k === 'chef' ? pick(CHEF_ATTACKS) : BOSS_SEQ[k][i % BOSS_SEQ[k].length];
  const visFor = { thrust2: 'fork', thrust1: 'pan', double: 'fork', shots: 'cleaver', chop: 'cleaver', chop2: 'pan', press: 'pin', press2: 'pin' };
  const push0 = pushBase;
  const push2 = o => { push0(o); if (k === 'chef') o.vis = visFor[a] || 'cleaver'; };
  const push = push2;
  if (a === 'press') { const o = { type: 'bpress', delay: 0, k: 0 }; pressSetup(o); push(o); }
  else if (a === 'press2') { const o = { type: 'bpress', delay: 0, k: 0 }; pressSetup(o); push(o); push({ type: 'bpress', delay: 1.05, k: 0, top: true, span: 1 }); }
  else if (a === 'beam') push({ type: 'bbeam', lanes: [targetLane()], delay: 0 });
  else if (a === 'beam2') { push({ type: 'bbeam', lanes: [targetLane()], delay: 0 }); push({ type: 'bbeam', lanes: null, delay: 0.9 }); }
  else if (a === 'thrust2') push({ type: 'bthrust', lanes: pairLanes(), delay: 0, hx: W + 160 });
  else if (a === 'thrust1') push({ type: 'bthrust', lanes: [targetLane()], delay: 0, hx: W + 160 });
  else if (a === 'double') {
    push({ type: 'bthrust', lanes: [targetLane()], delay: 0, hx: W + 160 });
    push({ type: 'bthrust', lanes: null, delay: 0.95, hx: W + 160 });
  } else if (a === 'shots') {
    for (let j = 0; j < nShots; j++) push({ type: 'bshot', lane: targetLane(), delay: j * 0.6, px: W, rot: 0 });
  } else if (a === 'chop') { const o = { type: 'bchop', delay: 0, k: 0 }; chopSetup(o); push(o); }
  else if (a === 'chop2') {
    const o = { type: 'bchop', delay: 0, k: 0 }; chopSetup(o); push(o);
    push({ type: 'bchop', delay: 1.0, k: 0, top: true, span: 1, x: PX });
  }
}

const TUT_TEXT = ['Свайпни ВГОРУ', 'Свайпни ВНИЗ', 'Тапни — і ти в центрі', 'Лови сметанку!', 'Ухиляйся від ножа!', 'Чудово! Поїхали!'];
function updateTut(dt) {
  tut.t += dt;
  const p = player, done = p.t >= 1;
  if (tut.wait > 0) { tut.wait -= dt; if (tut.wait <= 0) { tut.step++; tut.t = 0; tut.spawned = false; } return; }
  const next = () => { tut.wait = 0.5; SFX.level(); addPopup(pick(['Так!', 'Клас!', 'Супер!']), PX + 60, p.y - 60, '#ffd166', 24); };
  if (tut.step === 0 && done && p.lane === 0) next();
  else if (tut.step === 1 && done && p.lane === 2) next();
  else if (tut.step === 2 && done && p.lane === 1) next();
  else if (tut.step === 3) {
    if (!tut.spawned) { tut.spawned = true; tut.c0 = runCream; creams.push({ x: W + 40, y: LANES[0], lane: 0, got: false, missed: false, bob: 0, rain: true }); }
    if (runCream > tut.c0) next();
    else if (!creams.length) tut.spawned = false;
  } else if (tut.step === 4) {
    if (!tut.spawned) { tut.spawned = true; addVertical(p.lane === 2 ? 'bottom' : 'top', 1, SPAWN_X, false, 'knife'); obstacles[obstacles.length - 1].tut = true;
      if (p.lane === 1) { obstacles.pop(); addMiddle(SPAWN_X); obstacles[obstacles.length - 1].tut = true; } }
    if (obstacles.length && obstacles.every(o => o.dead || obPast(o)) && !obstacles.some(o => o.dead)) next();
  } else if (tut.step >= 5) {
    if (tut.t > 1.2) finishTut();
  }
}
function finishTut() {
  tut = null; save.tut = true; persist();
  $('btnSkipTut').style.display = 'none';
  sinceLast = 0; nextGap = 0.8;
}
function drawTut() {
  const st = Math.min(tut.step, 5);
  const pulse = 1 + 0.06 * Math.sin(time * 6);
  ctx.save(); ctx.translate(W / 2, FIELD_TOP + 70); ctx.scale(pulse, pulse);
  outlinedText(TUT_TEXT[st], 0, 0, 32, '#ffffff');
  ctx.restore();
  outlinedText('крок ' + Math.min(st + 1, 5) + ' з 5', W / 2, FIELD_TOP + 106, 15, '#ffffffbb', 'transparent');
  if (st > 2 || tut.wait > 0) return;
  // рука-підказка
  const hx = W / 2 + 70, cy = LANES[1];
  const k = (time * 1.2) % 1;
  let hy = cy;
  if (st === 0) hy = cy + 60 - k * 140;
  else if (st === 1) hy = cy - 60 + k * 140;
  ctx.save();
  ctx.globalAlpha = st === 2 ? 0.9 : Math.sin(Math.PI * k);
  if (st < 2) {
    ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(hx, st === 0 ? cy + 60 : cy - 60); ctx.lineTo(hx, hy); ctx.stroke();
  } else {
    ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(hx, hy, 20 + k * 26, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.fillStyle = '#ffd9b8'; ctx.strokeStyle = '#7a4a22'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(hx, hy, 16, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.restore();
}

/* ---------- досягнення / скіни / підказки ---------- */
function toast(text, sub, color = '#ffd166', dur = 2.6, keep = false) { toasts.push({ text, sub, color, dur, t: 0, keep }); }
function unlock(id) {
  if (save.ach[id]) return;
  const a = ACH.find(q => q.id === id);
  if (!a) return;
  save.ach[id] = 1; persist();
  SFX.ach();
  toast('🏆 ' + a.name, a.desc, '#ffd166', 2.8, true);
  const sk = SKINS.find(q => q.ach === id);
  if (sk) toast('Новий скін: ' + sk.name, 'обери його в меню «Скіни»', '#8ef0ff', 2.8, true);
}
function checkRunAch() {
  if (state !== 'play' && state !== 'dying') return;
  for (const [n, id] of [[500, 's500'], [1000, 's1000'], [2500, 's2500'], [5000, 's5000'], [10000, 's10000']]) if (score >= n) unlock(id);
  if (save.creamTotal + runCream >= 500) unlock('cream500');
  if (level >= 50) unlock('world6');
}

/* ---------- бонуси ---------- */
function scoreMul() { return power && (power.kind === 'gold' || power.kind === 'super') ? 2 : 1; }
function addScore(pts) { scoreF += pts; score = Math.floor(scoreF); }

function spawnPickup(x, freeLanes, creamLane) {
  const kinds = Object.keys(BONUS).filter(k => level >= BONUS[k].at && !(k === 'butter' && shield));
  if (!kinds.length) return;
  // той самий бонус двічі поспіль — утричі рідше
  const wt = k => BONUS[k].w * (k === lastBonus && kinds.length > 1 ? 0.33 : 1);
  let tot = 0;
  for (const k of kinds) tot += wt(k);
  let r = Math.random() * tot, kind = kinds[0];
  for (const k of kinds) { r -= wt(k); if (r <= 0) { kind = k; break; } }
  lastBonus = kind;
  const lanes = freeLanes.filter(l => l !== creamLane);
  const lane = lanes.length ? pick(lanes) : pick(freeLanes);
  pickups.push({ kind, x: lanes.length ? x : x + 190, y: LANES[lane], lane, got: false, bob: Math.random() * 6 });
}

function collectBonus(b) {
  b.got = true;
  vib(15);
  save.bonusTried[b.kind] = 1;
  if (Object.keys(save.bonusTried).length >= 5) unlock('bonus5');
  persist();
  SFX.power();
  player.happy = 0.5;
  for (let i = 0; i < 14; i++) {
    const a = Math.random() * Math.PI * 2, sp = rand(100, 260);
    addParticle(b.x, b.y, Math.cos(a) * sp, Math.sin(a) * sp, rand(3, 6), 'rgba(' + BONUS_RGB[b.kind] + ',1)', 0.6, 200);
  }
  if (b.kind === 'butter') { shield = true; showBanner('МАСЛО!', 'наступний удар зісковзне', '#ffd166'); return; }
  if (b.kind === 'pepper') { sneeze(); return; }
  if (power) endPower(true);
  const dur = BONUS[b.kind].dur;
  power = { kind: b.kind, t: dur, dur };
  if (b.kind === 'chili') { speedMul = 1.15; showBanner('ГОСТРИЙ РЕЖИМ!', 'пробиваєш усе ' + dur + ' с', '#ff6f59'); }
  else if (b.kind === 'ice') { decoy = { lane: player.lane }; showBanner('КРИЖАНИЙ МУЛЯЖ!', 'відійди — виделки цілять у копію', '#7ec8ff', 1.8); }
  else if (b.kind === 'gold') showBanner('ЗОЛОТА ВИДЕЛКА!', 'x2 очки ' + dur + ' с', '#ffd166');
}

function endPower(replaced) {
  if (!power) return;
  if (power.kind === 'chili' || power.kind === 'super') {
    speedMul = 1;
    invuln = Math.max(invuln, replaced ? 0.3 : 0.9);  // коротка пауза, щоб не врізатись одразу
    if (!replaced) addPopup('гострота минула', PX + 40, player.y - 60, '#ffffffcc', 18);
  }
  if (power.kind === 'ice' && decoy) {
    const y = LANES[decoy.lane];
    for (let i = 0; i < 14; i++) addParticle(PX, y, rand(-200, 200), rand(-260, 60), rand(3, 6), pick(['#e8f8ff', '#9fd8ff', '#ffffff']), 0.7, 700, 1);
    SFX.glass();
    decoy = null;
  }
  power = null;
}

function decoyHit() {
  const y = LANES[decoy.lane];
  SFX.glass();
  addPopup('НАКОЛОВ МУЛЯЖ!', PX + 50, y - 56, '#9fd8ff', 20);
  for (let i = 0; i < 8; i++) addParticle(PX, y, rand(-160, 160), rand(-200, 40), rand(2, 5), pick(['#e8f8ff', '#9fd8ff']), 0.5, 600, 1);
}

function sneeze() {
  showBanner('АПЧХИ!', 'перець зніс усе навколо', '#ffffff', 1.3);
  SFX.sneeze();
  shake = Math.max(shake, 0.6); flash = Math.max(flash, 0.35);
  for (let i = 0; i < 24; i++) {
    const a = (i / 24) * Math.PI * 2;
    addParticle(PX, player.y, Math.cos(a) * 520, Math.sin(a) * 520, rand(3, 6), 'rgba(255,255,255,.9)', 0.5, 0);
  }
  for (const o of obstacles) {
    if (o.dead) continue;
    const sh = obstacleShapes(o);
    if (!sh.length) continue;
    let minx = Infinity;
    for (const q of sh) minx = Math.min(minx, q[0] === 'r' ? q[1] : q[1] - q[3]);
    if (minx < W + 10) smash(o, 'pepper');   // лише те, що вже на екрані
  }
}

// перешкода розбита: вилітає з поля, обертаючись
function smash(o, why) {
  const sh = obstacleShapes(o);
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const q of sh) {
    if (q[0] === 'r') { x0 = Math.min(x0, q[1]); y0 = Math.min(y0, q[2]); x1 = Math.max(x1, q[1] + q[3]); y1 = Math.max(y1, q[2] + q[4]); }
    else { x0 = Math.min(x0, q[1] - q[3]); y0 = Math.min(y0, q[2] - q[3]); x1 = Math.max(x1, q[1] + q[3]); y1 = Math.max(y1, q[2] + q[3]); }
  }
  if (!sh.length) { x0 = x1 = PX; y0 = y1 = LANES[1]; }
  o.cx = (x0 + x1) / 2; o.cy = clamp((y0 + y1) / 2, FIELD_TOP, FIELD_BOT);
  o.dead = true; o.deadT = 0; o.fx = 0; o.fy = 0; o.fr = 0;
  o.fvx = rand(120, 320); o.fvy = -rand(350, 650); o.fvr = rand(-10, 10);
  addScore(15 * scoreMul());
  SFX.smash();
  vib(25);
  shake = Math.max(shake, 0.3);
  const hx = why === 'pepper' ? clamp(o.cx, 20, W - 20) : PX + 36, hy = why === 'pepper' ? o.cy : player.y;
  for (let i = 0; i < 10; i++) addParticle(hx, hy, rand(-200, 260), rand(-260, 160), rand(2.5, 5), pick(['#ffffff', '#dfe6ec', '#ffd166']), 0.5, 500, 1);
  if (why === 'chili') addPopup(pick(['БАХ!', 'ГОСТРО!', 'З ДОРОГИ!', 'ПФФ!']), PX + 40, player.y - 60, '#ff6f59', 24);
  else if (why === 'butter') addPopup('ЗІСКОВЗНУЛО!', PX + 50, player.y - 60, '#ffd166', 22);
}

function nearMiss(o) {
  nmStreak = nmTimer > 0 ? Math.min(nmStreak + 1, 5) : 1;
  nmTimer = 4;
  runNear++;
  save.nearTotal = (save.nearTotal || 0) + 1;

  addPopup('ЛЕДЬ НЕ!' + (nmStreak > 1 ? ' x' + nmStreak : ''), PX + 70, player.y - 62, '#8ef0ff', 24, 1.0);

  for (let i = 0; i < 8; i++) addParticle(PX + 20, player.y + rand(-30, 30), rand(160, 360), rand(-40, 40), rand(2, 4), '#bff6ff', 0.35, 0);
}

function collectCream(c) {
  c.got = true;
  combo++;
  runCream++;
  runBestCombo = Math.max(runBestCombo, combo);
  const mult = Math.min(combo, 10);
  const pts = 10 * mult * scoreMul();
  scoreF += pts; score = Math.floor(scoreF);
  player.happy = 0.45;
  SFX.cream(combo);
  addPopup('+' + pts, c.x + 10, c.y - 34, '#fff', 26);
  for (let i = 0; i < 10; i++) {
    const a = Math.random() * Math.PI * 2, s = rand(80, 220);
    addParticle(c.x, c.y, Math.cos(a) * s, Math.sin(a) * s, rand(3, 7), Math.random() < 0.7 ? '#ffffff' : '#ffe9a8', 0.5, 300);
  }
  if (combo >= 10) unlock('combo10');
  if (combo === 5)  { SFX.combo(); showBanner('СМЕТАННИЙ МАЙСТЕР!', 'комбо x5', '#ffd166'); }
  else if (combo === 10) { SFX.combo(); showBanner('СМЕТАНОМАН!', 'комбо x10', '#ffd166'); }
  else if (combo > 10 && combo % 10 === 0) { SFX.combo(); showBanner('СМЕТАННИЙ БОГ!', 'комбо x' + combo, '#ffd166'); }
}

function showBanner(text, sub, color = '#fff', dur = 1.3) {
  banner = { text, sub, t: 0, dur, color };
}

function completeLevel() {
  const finishedWorld = (level % 10) === 9;
  const bonus = 50 * (Math.floor(level / 10) + 1);
  scoreF += bonus; score = Math.floor(scoreF);
  addPopup('+' + bonus + ' за рівень', W / 2, FIELD_TOP + 60, '#ffd166', 24, 1.4);

  if (level === TOTAL_LEVELS - 1) unlock('finish');
  if (level < TOTAL_LEVELS - 1) {
    level++;
    if (level > save.maxLevel) { save.maxLevel = level; persist(); }
    if (finishedWorld) {
      SFX.world();
      showBanner('СВІТ ' + (Math.floor(level / 10) + 1) + '!', WORLDS[Math.floor(level / 10)].name, '#ffd166', 2.2);
    } else {
      SFX.level();
      showBanner('РІВЕНЬ ' + lvlName(level), pick(LEVEL_PHRASES), '#fff', 1.6);
    }
    beginLevel(false);
  } else {
    // пройдено всю кухню — далі нескінченний режим на максимальній складності
    SFX.world();
    showBanner('ВСЮ КУХНЮ ПРОЙДЕНО!', 'тепер — нескінченність', '#ffd166', 2.6);
    save.maxLevel = TOTAL_LEVELS - 1; persist();
    level = TOTAL_LEVELS - 2;   // нескінченність: чергуємо 10-9 і 10-10 (з босом)
    beginLevel(false);
  }
  for (let i = 0; i < 26; i++) {
    addParticle(rand(40, W - 40), FIELD_TOP + rand(0, 40), rand(-60, 60), rand(50, 200), rand(4, 8),
      pick(['#ffd166', '#ff6f59', '#06d6a0', '#118ab2', '#ffffff']), 1.6, 220, 1);
  }
}

function die(o) {
  state = 'dying';
  deathT = 0;
  player.dead = true;
  shake = 1; flash = 1;
  SFX.splat();
  btnPause.style.display = 'none';
  touch = null;
  // розплескування: тісто + фарш
  for (let i = 0; i < 26; i++) {
    const a = rand(-Math.PI, Math.PI), s = rand(120, 420);
    const isDough = Math.random() < 0.6;
    addParticle(PX, player.y, Math.cos(a) * s, Math.sin(a) * s - 80, isDough ? rand(5, 11) : rand(4, 8),
      isDough ? pick(['#fbe7bd', '#f3d59a', '#fff1d0']) : pick(['#a0673f', '#8a5531', '#b97f4f']), rand(0.7, 1.2), 900, isDough ? 0 : 1);
  }
  vib([60, 40, 90]);
  save.deaths++;
  if (save.deaths >= 50) unlock('deaths50');
  checkRunAch();
  save.creamTotal += runCream;
  if (runBestCombo > save.bestCombo) save.bestCombo = runBestCombo;
  if (score > save.best) { isNewRecord = save.best > 0; save.best = score; }
  persist();
}

function updateParticles(dt) {
  for (const p of particles) {
    p.life -= dt;
    p.vy += p.grav * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.985;
    p.rot += p.vr * dt;
  }
  particles = particles.filter(p => p.life > 0);
  for (const t of popups) { t.life -= dt; t.y -= 40 * dt; }
  popups = popups.filter(t => t.life > 0);
}

/* =========================================================
   МАЛЮВАННЯ
   ========================================================= */
function render() {
  const wd = WORLDS[Math.floor(level / 10)];
  ctx.setTransform(scale, 0, 0, scale, 0, 0);

  // фон-HUD
  ctx.fillStyle = wd.hud;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  if (shake > 0) ctx.translate(rand(-1, 1) * 10 * shake, rand(-1, 1) * 10 * shake);

  // поле
  ctx.fillStyle = wd.bg;
  ctx.fillRect(-20, FIELD_TOP, W + 40, FIELD_H);
  drawBackground(wd);

  drawSpeedLines();
  drawEventFx();

  // сметанка і бонуси
  for (const c of creams) {
    const fall = c.rain ? clamp((c.x - (PX + 140)) / (W - PX), 0, 1) : 0;   // «падає з неба»
    drawCream(c.x, c.y + Math.sin(time * 4 + c.bob) * 4 - fall * fall * (c.y - FIELD_TOP + 40));
  }
  for (const b of pickups) drawPickup(b.kind, b.x, b.y + Math.sin(time * 4 + b.bob) * 4, 1, true);
  for (const q of bubbles) {
    ctx.save(); ctx.globalAlpha = 0.8;
    ctx.fillStyle = 'rgba(200,240,255,.25)'; ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(q.x - q.r * 0.35, q.y - q.r * 0.35, q.r * 0.22, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // перешкоди (обрізані по полю — так вони «встромлені» у скатертину)
  ctx.save();
  ctx.beginPath(); ctx.rect(-40, FIELD_TOP, W + 80, FIELD_H); ctx.clip();
  drawBoss();
  for (const o of obstacles) {
    if (o.dead) {
      ctx.save();
      ctx.globalAlpha = clamp(1 - o.deadT / 1.2, 0, 1);
      ctx.translate(o.cx + o.fx, o.cy + o.fy); ctx.rotate(o.fr); ctx.translate(-o.cx, -o.cy);
      drawObstacle(o);
      ctx.restore();
    } else drawObstacle(o);
  }
  ctx.restore();

  // смуги-скатертини
  drawBorder(FIELD_TOP, wd);
  drawBorder(FIELD_BOT, wd);

  // попередження
  for (const o of obstacles) {
    if (o.dead) continue;
    if (OBT[o.type] && OBT[o.type].warn) OBT[o.type].warn(o);
    if (o.type === 'side' && (!o.launched || o.x > W - 10)) drawWarning(LANES[o.lane]);
    if (o.type === 'vert' && o.jumper && o.x - o.w / 2 > W - 6) {
      const r = vertRange(o);
      drawJumpWarning((clamp(r[0], FIELD_TOP, FIELD_BOT) + clamp(r[1], FIELD_TOP, FIELD_BOT)) / 2, o.down ? 1 : -1);
    }
  }

  // пельмень
  if (decoy && state !== 'menu') drawDecoy(PX - 6, LANES[decoy.lane]);
  if (state !== 'menu') drawPelmen(PX, player.y);

  // частинки
  for (const p of particles) {
    ctx.globalAlpha = clamp(p.life / p.max * 1.5, 0, 1);
    ctx.fillStyle = p.color;
    if (p.shape === 1) {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillRect(-p.r, -p.r * 0.6, p.r * 2, p.r * 1.2); ctx.restore();
    } else {
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  ctx.restore();

  // HUD
  if (state !== 'menu') drawHUD(wd);

  // написи
  for (const t of popups) {
    ctx.globalAlpha = clamp(t.life / t.max * 2, 0, 1);
    outlinedText(t.text, t.x, t.y, t.size, t.color);
  }
  ctx.globalAlpha = 1;

  if (banner) drawBanner();
  if (state !== 'menu') drawToast();
  if (tut && state === 'play') drawTut();

  if (countdown > 0 && state === 'play') {
    const n = Math.ceil(countdown);
    const f = countdown - Math.floor(countdown);
    outlinedText(String(n), W / 2, H / 2, 90 + f * 40, '#fff');
  }

  if (flash > 0) { ctx.fillStyle = 'rgba(255,255,255,' + (flash * 0.6) + ')'; ctx.fillRect(0, 0, W, H); }
}

const FONT = '"Arial Black","Segoe UI",Roboto,Helvetica,Arial,sans-serif';
function paintText(c, text, x, y, size, color, stroke, align) {
  c.font = '900 ' + size + 'px ' + FONT;
  c.textAlign = align; c.textBaseline = 'middle';
  c.lineJoin = 'round';
  if (stroke !== 'transparent') {
    c.lineWidth = Math.max(3, size * 0.16);
    c.strokeStyle = stroke;
    c.strokeText(text, x, y);
  }
  c.fillStyle = color;
  c.fillText(text, x, y);
}
// Напис спершу малюється повністю непрозорим на окремому полотні, а вже потім
// накладається з прозорістю — так літера лишається суцільною, без видимих «швів».
const textCache = new Map();
function textSprite(text, size, color, stroke) {
  const key = text + '|' + size + '|' + color + '|' + stroke + '|' + scale;
  let sp = textCache.get(key);
  if (sp) return sp;
  if (textCache.size > 120) textCache.clear();
  const cv = document.createElement('canvas');
  const c = cv.getContext('2d');
  c.font = '900 ' + size + 'px ' + FONT;
  const pad = Math.max(3, size * 0.16) + 4;
  const w = c.measureText(text).width + pad * 2, h = size * 1.4 + pad * 2;
  cv.width = Math.ceil(w * scale); cv.height = Math.ceil(h * scale);
  c.scale(scale, scale);
  paintText(c, text, w / 2, h / 2, size, color, stroke, 'center');
  sp = { cv, w, h };
  textCache.set(key, sp);
  return sp;
}
function outlinedText(text, x, y, size, color, stroke = '#2a1a0c', align = 'center') {
  size = Math.round(size);
  if (ctx.globalAlpha < 0.999 || /^#[0-9a-f]{8}$/i.test(color)) {
    const sp = textSprite(text, size, color, stroke);
    const pad = Math.max(3, size * 0.16) + 4;
    let dx = x - sp.w / 2;
    if (align === 'left') dx = x - pad; else if (align === 'right') dx = x - sp.w + pad;
    ctx.drawImage(sp.cv, dx, y - sp.h / 2, sp.w, sp.h);
    return;
  }
  paintText(ctx, text, x, y, size, color, stroke, align);
}

/* ---- фон: плитка на стіні + полиця з силуетами ---- */
const SHAPES = [];
(function buildShapes() {
  let x = 0;
  while (x < 900) {
    const t = randi(0, 4), w = randi(26, 60);
    SHAPES.push({ x, t, w, h: randi(30, 80), i: randi(0, 999) });
    x += w + randi(14, 46);
  }
})();
const SHAPES_LEN = 900;

function drawBackground(wd) {
  // плитка
  ctx.strokeStyle = wd.bg2; ctx.globalAlpha = 0.35; ctx.lineWidth = 2;
  const tile = 70, off = -(bgScroll * 0.6 % tile);
  ctx.beginPath();
  for (let x = off; x < W + tile; x += tile) { ctx.moveTo(x, FIELD_TOP); ctx.lineTo(x, FIELD_BOT); }
  for (let y = FIELD_TOP + 22; y < FIELD_BOT; y += tile) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();
  ctx.globalAlpha = 1;

  // силуети посуду на полиці зверху
  ctx.fillStyle = wd.bg2;
  const set = WORLD_SETS[Math.floor(level / 10)];
  const shelfY = FIELD_TOP + 108;
  ctx.globalAlpha = 0.85;
  ctx.fillRect(0, shelfY, W, 6);
  const off2 = bgScroll % SHAPES_LEN;
  for (let rep = 0; rep < 2; rep++) {
    for (const s of SHAPES) {
      const x = s.x - off2 + rep * SHAPES_LEN;
      if (x > W || x + s.w < 0) continue;
      drawSilhouette({ t: set[s.i % set.length], w: s.w, h: s.h }, x, shelfY);
    }
  }
  // силуети знизу (стіл з посудом), повільніше
  const tableY = FIELD_BOT - 4;
  const off3 = (bgScroll * 0.7) % SHAPES_LEN;
  ctx.globalAlpha = 0.45;
  for (let rep = 0; rep < 2; rep++) {
    for (const s of SHAPES) {
      const x = SHAPES_LEN - s.x - s.w - off3 + rep * SHAPES_LEN;
      if (x > W || x + s.w < 0) continue;
      drawSilhouette({ t: set[(s.i + 2) % set.length], w: s.w * 1.2, h: s.h * 0.9 }, x, tableY);
    }
  }
  ctx.globalAlpha = 1;
  drawAmb();
}
function drawSilhouette(s, x, baseY) {
  const w = s.w, h = s.h;

  drawUtensil(o.kind, o.L, o.w, o.jumper);

      drawArrow(0, 0, o.down ? 1 : -1, 11, '#fff');
      ctx.restore();
    }
  }
}

// Малює кухонний ніж або виделку від основи (0,0) угору на довжину len.
function drawUtensil(kind, len, w, evil) {
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  const OUT = '#39424c';
  if (kind === 'knife') {
    const hl = len * 0.36;                    // ручка (пропорційно довжині)
    const bt = -hl - 9;                       // початок леза
    const top = -len;
    const hw = w * 0.3;

    const hg = ctx.createLinearGradient(-hw, 0, hw, 0);
    hg.addColorStop(0, '#3a2116'); hg.addColorStop(0.45, '#6b3d26'); hg.addColorStop(1, '#2e1a11');
    ctx.fillStyle = hg;
    ctx.beginPath();
    ctx.moveTo(-hw + 1, 6);
    ctx.quadraticCurveTo(-hw - 2, -hl * 0.5, -hw, -hl);
    ctx.lineTo(hw, -hl);
    ctx.quadraticCurveTo(hw + 3, -hl * 0.5, hw + 1, 6);
    ctx.closePath();
    ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = OUT; ctx.stroke();
    // хвостовик і заклепки
    ctx.fillStyle = '#b9c2cb';
    ctx.fillRect(-1.5, -hl + 4, 3, hl - 6);
    for (const k of [0.22, 0.52, 0.82]) {
      ctx.beginPath(); ctx.arc(0, -hl * k, 3.6, 0, Math.PI * 2);
      ctx.fillStyle = '#e3e8ed'; ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = '#6d7782'; ctx.stroke();
    }
    // --- упор (больстер) ---
    ctx.fillStyle = '#a7b1bb';
    rr(-hw - 3, -hl - 10, hw * 2 + 6, 11, 4); ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = OUT; ctx.stroke();
    // --- лезо: обух зліва (прямий), ріжуча кромка справа (вигнута до вістря) ---

    ctx.beginPath();

    ctx.lineTo(L, top + w * 1.1);
    ctx.quadraticCurveTo(L + 1, top + w * 0.35, L + w * 0.32, top);          // обух плавно опускається до вістря
    ctx.quadraticCurveTo(R, top + w * 0.85, R, top + w * 2.6);                // «черево» кромки
    ctx.lineTo(R, bt - 4);
    ctx.quadraticCurveTo(R, bt, R - 5, bt);
    ctx.closePath();
    const bg = ctx.createLinearGradient(L, 0, R, 0);
    if (evil === 'gold') { bg.addColorStop(0, '#fff3b0'); bg.addColorStop(0.55, '#e8b000'); bg.addColorStop(1, '#ffd84d'); }
    else if (evil) { bg.addColorStop(0, '#ffe3df'); bg.addColorStop(0.55, '#e9c3bf'); bg.addColorStop(1, '#f7dcd8'); }
    else { bg.addColorStop(0, '#fbfdff'); bg.addColorStop(0.55, '#cdd6de'); bg.addColorStop(1, '#eef3f7'); }
    ctx.fillStyle = bg;
    ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = OUT; ctx.stroke();
    // заточка — світла смуга вздовж кромки
    ctx.beginPath();
    ctx.moveTo(L + w * 0.36, top + 6);
    ctx.quadraticCurveTo(R - 7, top + w * 0.95, R - 7, top + w * 2.6);
    ctx.lineTo(R - 7, bt - 2);
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(120,135,150,.55)'; ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(R - 3.5, top + w * 2.4); ctx.lineTo(R - 3.5, bt - 3);
    ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.stroke();
    // відблиск на обуху
    ctx.beginPath(); ctx.moveTo(L + 4, bt - 4); ctx.lineTo(L + 4, top + w * 1.15);
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.stroke();
  } else {
    // --- столова виделка однією деталлю, усі частини пропорційні довжині ---
    const hl = len * 0.5;                     // ручка
    const neck = len * 0.14;                  // шийка, що розширюється в головку
    const headY = -hl - neck;                 // де починається головка
    const gapY = headY - len * 0.07;          // дно проміжків між зубцями (зубці ≈ 29%)
    const top = -len;
    const tipLen = Math.min(12, len * 0.05);
    const g = w * 0.1, tw = (w - g * 3) / 4;
    const L = -w / 2, R = w / 2;
    const hb = w * 0.15, hm = w * 0.26, hn = w * 0.1;   // ширина ручки: основа, середина, шийка
    ctx.beginPath();

    ctx.quadraticCurveTo(-hn, headY + neck * 0.35, L, headY);     // шийка → плече

        ctx.lineTo(x1, gapY);
        ctx.quadraticCurveTo(x1 + g / 2, gapY + g, x1 + g, gapY);       // заокруглене дно проміжку
      }
    }
    ctx.lineTo(R, headY);
    ctx.quadraticCurveTo(hn, headY + neck * 0.35, hn, -hl);
    ctx.quadraticCurveTo(hm, -hl * 0.55, hb, 8);
    ctx.closePath();
    const fg = ctx.createLinearGradient(L, 0, R, 0);
    if (evil === 'gold') { fg.addColorStop(0, '#fff3b0'); fg.addColorStop(0.5, '#e8b000'); fg.addColorStop(1, '#ffd84d'); }
    else if (evil) { fg.addColorStop(0, '#ffe3df'); fg.addColorStop(0.5, '#e6bfba'); fg.addColorStop(1, '#f7dcd8'); }
    else { fg.addColorStop(0, '#fbfdff'); fg.addColorStop(0.5, '#c9d2db'); fg.addColorStop(1, '#eef3f7'); }
    ctx.fillStyle = fg;
    ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = OUT; ctx.stroke();
    // відблиски
    ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(-hb * 0.5, -6); ctx.quadraticCurveTo(-hm * 0.55, -hl * 0.55, -hn * 0.5, -hl + 4); ctx.stroke();
    for (let i = 0; i < 4; i++) {
      const x0 = L + i * (tw + g) + 2.2;
      ctx.beginPath(); ctx.moveTo(x0, gapY - 3); ctx.lineTo(x0, top + tipLen + 3); ctx.stroke();
    }
    // ледь помітна виїмка на ручці
    ctx.strokeStyle = 'rgba(90,105,120,.35)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(hb * 0.4, -10); ctx.quadraticCurveTo(hm * 0.4, -hl * 0.55, hn * 0.3, -hl + 8); ctx.stroke();
  }
}

function drawGrater(o) {

const NOFX = { power: null, shield: false, invuln: 0 };
function drawPelmen(x, y, p = player, fx = null, skin = save.skin) {

    ctx.closePath(); ctx.fill(); ctx.stroke();
