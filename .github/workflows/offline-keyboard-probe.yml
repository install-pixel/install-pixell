name: Offline Keyboard Model Probe

# Temporary: lists which OPUS-MT models exist and their sizes, to pick the translation models.
on:
  push:
    branches:
      - claude/offline-keyboard-android-w9kw2a
    paths:
      - '.github/workflows/offline-keyboard-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check models
        run: |
          for m in opus-mt-uk-pl opus-mt-pl-uk opus-mt-uk-en opus-mt-en-uk opus-mt-pl-en opus-mt-en-pl opus-mt-en-zlw opus-mt-zlw-en \
                   opus-mt-tc-big-en-pl opus-mt-tc-big-pl-en opus-mt-tc-big-zle-zlw opus-mt-tc-big-zlw-zle \
                   opus-mt-tc-big-en-zle opus-mt-tc-big-zle-en opus-mt-tc-big-en-zlw opus-mt-tc-big-zlw-en \
                   opus-mt-tc-big-en-uk opus-mt-tc-big-uk-en opus-mt-tc-base-uk-pl opus-mt-tc-base-pl-uk \
                   opus-mt-tc-base-en-pl opus-mt-tc-base-uk-en opus-mt-tc-base-en-uk; do
            json=$(curl -s "https://huggingface.co/api/models/Helsinki-NLP/$m?blobs=true")
            if echo "$json" | grep -q '"modelId"'; then
              size=$(echo "$json" | python3 -c "import json,sys; d=json.load(sys.stdin); print(sum(s.get('size',0) for s in d.get('siblings',[]) if s['rfilename'] in ('pytorch_model.bin','model.safetensors'))//1000000)")
              echo "FOUND $m ${size}MB"
            else
              echo "MISSING $m"
            fi
          done
      - name: Language tokens and benchmarks
        run: |
          for m in opus-mt-tc-big-zle-zlw opus-mt-tc-big-zlw-zle opus-mt-tc-big-en-zle opus-mt-en-zlw opus-mt-tc-big-en-zlw; do
            echo "== $m"
            curl -sL "https://huggingface.co/Helsinki-NLP/$m/raw/main/README.md" | grep -iE ">>(pol|ukr)<<|ukr-pol|pol-ukr|eng-pol|eng-ukr|ukr-eng|pol-eng" | head -20
          done
          for m in opus-mt-uk-pl opus-mt-pl-uk opus-mt-uk-en opus-mt-en-uk opus-mt-pl-en opus-mt-tc-big-zle-en opus-mt-tc-big-zlw-en; do
            echo "== $m"
            curl -sL "https://huggingface.co/Helsinki-NLP/$m/raw/main/README.md" | grep -iE "tatoeba|flores" | grep -iE "ukr|pol|eng|uk|pl" | head -8
          done
