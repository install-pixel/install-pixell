name: BlackLaunch voice models cleanup

# Одноразово: моделі тепер беруться з релізу keyboard-models (спільні з клавіатурою),
# тому дубльований реліз blacklaunch-models видаляється. Сам файл видаляється наступним комітом.
on:
  push:
    paths:
      - '.github/workflows/blacklaunch-models.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete duplicate release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete blacklaunch-models --cleanup-tag --yes || true
