name: Offline Keyboard Bigrams

# Builds the next-word lists from the Tatoeba sentences (the download host is reachable from GitHub's
# runners) and uploads them as an artifact, to be committed by hand.
on:
  push:
    paths:
      - 'offline-keyboard/tools/dictionary/build_bigrams.py'
      - '.github/workflows/offline-keyboard-bigrams.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bigrams:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: offline-keyboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the next-word lists
        run: python3 tools/dictionary/build_bigrams.py /tmp/bigrams
      - uses: actions/upload-artifact@v4
        with:
          name: offline-keyboard-next-words
          path: offline-keyboard/core/src/main/resources/dictionary/*_next.txt
