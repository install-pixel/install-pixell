name: Offline Keyboard Bigrams

# Builds the next-word lists from the Tatoeba sentences (the download host is reachable from GitHub's
# runners) and publishes them on the keyboard-data release, to be checked and committed by hand.
on:
  push:
    paths:
      - 'offline-keyboard/tools/dictionary/build_bigrams.py'
      - '.github/workflows/offline-keyboard-bigrams.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bigrams:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: offline-keyboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the next-word lists
        run: python3 tools/dictionary/build_bigrams.py /tmp/bigrams
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: keyboard-data
          name: OffKey data (built lists)
          prerelease: true
          body: Lists built in CI for the keyboard (next words from Tatoeba, CC BY 2.0 FR).
          files: offline-keyboard/core/src/main/resources/dictionary/*_next.txt
