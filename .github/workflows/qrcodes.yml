name: QRaft APK

on:
  push:
    paths:
      - 'qrcodes/**'
      - '.github/workflows/qrcodes.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qrcodes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qrcodes

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, unit tests, lint
        run: |
          ./gradlew --no-daemon testDebugUnitTest lintDebug
          ./gradlew --no-daemon assembleRelease

      # Схема бази Room — у лозі й в артефакті, щоб закомітити її в репозиторій.
      - name: Show Room schema
        run: |
          for f in $(find app/schemas -name '*.json' 2>/dev/null); do
            echo "=== $f"
            cat "$f"
          done

      # Версія та коміт у назві файлу, щоб на телефоні не сплутати зі старим APK.
      - name: Rename APK
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          APK="QRaft-v${VERSION}-${GITHUB_SHA::7}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          # Копія з постійною назвою — одне посилання в закладках завжди дає найновішу збірку.
          cp app/build/outputs/apk/release/app-release.apk QRaft.apk
          # Стара постійна назва — щоб давні закладки теж давали найновішу збірку.
          cp app/build/outputs/apk/release/app-release.apk QrCodes.apk
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: qrcodes-apk
          path: |
            qrcodes/${{ env.APK }}
            qrcodes/app/build/reports/lint-results-debug.html
            qrcodes/app/schemas/**

      - name: Remove previous test release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete qrcodes-latest --cleanup-tag --yes || true
          gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '.[] | select(.draft and .tag_name == "qrcodes-latest") | .id' \
            | xargs -r -I{} gh api -X DELETE "repos/${{ github.repository }}/releases/{}" || true

      # Постійне посилання для завантаження APK прямо на телефон.
      - name: Publish rolling test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: qrcodes-latest
          target_commitish: ${{ github.sha }}
          name: QRaft v${{ env.VERSION }} (тестова збірка)
          prerelease: true
          make_latest: false
          body: |
            Остання тестова збірка QRaft з гілки ${{ github.ref_name }}.
            Версія: ${{ env.VERSION }}
            Коміт: ${{ github.sha }}
            Постійне посилання: https://github.com/${{ github.repository }}/releases/download/qrcodes-latest/QRaft.apk
          files: |
            qrcodes/${{ env.APK }}
            qrcodes/QRaft.apk
            qrcodes/QrCodes.apk

      - name: Make sure the test release is published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit qrcodes-latest --draft=false --prerelease --target "${{ github.sha }}"
          gh release view qrcodes-latest --json isDraft,assets --jq '"draft=\(.isDraft) assets=\(.assets | length)"'
