name: BlackLaunch APK

on:
  push:
    paths:
      - 'blacklaunch/**'
      - '.github/workflows/blacklaunch.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blacklaunch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blacklaunch

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, unit tests, lint
        # Спершу тести (там є замір швидкості пошуку), потім релізна збірка з R8 — щоб не змагались за процесор.
        run: |
          ./gradlew --no-daemon testDebugUnitTest lintDebug
          ./gradlew --no-daemon assembleRelease

      # Схема бази Room у лозі — щоб закомітити її в репозиторій, якщо змінилася.
      - name: Show Room schema
        run: |
          for f in $(find app/schemas -name '*.json' 2>/dev/null); do
            echo "=== $f"
            cat "$f"
          done
          # Схема в репозиторії має збігатися зі згенерованою — інакше забули закомітити зміну й міграцію.
          if [ -n "$(git status --porcelain app/schemas)" ]; then
            git status --porcelain app/schemas
            git diff app/schemas || true
            echo "::error::Room schema changed — commit app/schemas and add a migration"
            exit 1
          fi

      # Версія та коміт у назві файлу, щоб на телефоні не сплутати зі старим APK.
      - name: Rename APK
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          APK="BlackGlass-v${VERSION}-${GITHUB_SHA::7}.apk"
          # З 1.0.0 — релізна збірка (R8), підписана тим самим ключем, що й тестові: ставиться поверх.
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          # Копія з постійною назвою — одне посилання в закладках завжди дає найновішу збірку.
          cp app/build/outputs/apk/release/app-release.apk BlackGlass.apk
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: blacklaunch-debug-apk
          path: |
            blacklaunch/${{ env.APK }}
            blacklaunch/app/build/reports/lint-results-debug.html
            blacklaunch/app/schemas/**

      # Старий тестовий реліз видаляється разом із тегом, щоб у ньому лежав лише один, свіжий APK.
      - name: Remove previous test release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete blacklaunch-latest --cleanup-tag --yes || true

      # Постійне посилання для завантаження APK прямо на телефон.
      - name: Publish rolling test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: blacklaunch-latest
          target_commitish: ${{ github.sha }}
          name: Black Glass v${{ env.VERSION }} (тестова збірка)
          prerelease: true
          body: |
            Остання тестова збірка Black Glass з гілки ${{ github.ref_name }}.
            Версія: ${{ env.VERSION }}
            Коміт: ${{ github.sha }}
            Постійне посилання: https://github.com/${{ github.repository }}/releases/download/blacklaunch-latest/BlackGlass.apk
          files: |
            blacklaunch/${{ env.APK }}
            blacklaunch/BlackGlass.apk
