name: BlackLaunch APK

on:
  push:
    paths:
      - 'blacklaunch/**'
      - '.github/workflows/blacklaunch.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blacklaunch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blacklaunch

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, unit tests, lint
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug

      # Схема бази Room у лозі — щоб закомітити її в репозиторій, якщо змінилася.
      - name: Show Room schema
        run: |
          for f in $(find app/schemas -name '*.json' 2>/dev/null); do
            echo "=== $f"
            cat "$f"
          done
          git status --porcelain app/schemas

      # Версія та коміт у назві файлу, щоб на телефоні не сплутати зі старим APK.
      - name: Rename APK
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          APK="BlackLaunch-v${VERSION}-${GITHUB_SHA::7}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: blacklaunch-debug-apk
          path: |
            blacklaunch/${{ env.APK }}
            blacklaunch/app/build/reports/lint-results-debug.html
            blacklaunch/app/schemas/**

      # Старий тестовий реліз видаляється разом із тегом, щоб у ньому лежав лише один, свіжий APK.
      - name: Remove previous test release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete blacklaunch-latest --cleanup-tag --yes || true

      # Постійне посилання для завантаження APK прямо на телефон.
      - name: Publish rolling test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: blacklaunch-latest
          target_commitish: ${{ github.sha }}
          name: BlackLaunch v${{ env.VERSION }} (тестова збірка)
          prerelease: true
          body: |
            Остання тестова збірка BlackLaunch з гілки ${{ github.ref_name }}.
            Версія: ${{ env.VERSION }}
            Коміт: ${{ github.sha }}
          files: blacklaunch/${{ env.APK }}
