name: BlackLaunch APK

on:
  push:
    paths:
      - 'blacklaunch/**'
      - '.github/workflows/blacklaunch.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blacklaunch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blacklaunch

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, unit tests, lint
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BlackLaunch-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: blacklaunch-debug-apk
          path: |
            blacklaunch/BlackLaunch-debug.apk
            blacklaunch/app/build/reports/lint-results-debug.html

      # Постійне посилання для завантаження APK прямо на телефон.
      - name: Publish rolling test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: blacklaunch-latest
          name: BlackLaunch (тестова збірка)
          prerelease: true
          body: |
            Остання тестова збірка BlackLaunch з гілки ${{ github.ref_name }}.
            Коміт: ${{ github.sha }}
          files: blacklaunch/BlackLaunch-debug.apk
