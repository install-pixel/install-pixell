name: Offline Keyboard

on:
  workflow_call:
  push:
    paths:
      - 'offline-keyboard/**'
      - '.github/workflows/offline-keyboard.yml'
  pull_request:
    paths:
      - 'offline-keyboard/**'
      - '.github/workflows/offline-keyboard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: offline-keyboard

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # JDK 21: its java.text.BreakIterator handles extended grapheme clusters (ZWJ emoji) like Android's ICU,
      # so the :core grapheme tests match device behaviour. JDK 17 splits such emoji.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, lint and debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :core:test :mt:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      # Offline is a hard requirement: fail the build if any network permission reaches the APK.
      - name: Check APK has no network permissions
        run: |
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)aapt2"
          "$AAPT2" dump permissions app/build/outputs/apk/debug/app-debug.apk | tee permissions.txt
          if grep -E "android.permission.(INTERNET|ACCESS_NETWORK_STATE)" permissions.txt; then
            echo "::error::Network permission found in APK"
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: offline-keyboard-debug-apk
          path: offline-keyboard/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-keyboard-reports
          path: |
            offline-keyboard/core/build/reports/
            offline-keyboard/app/build/reports/

  # Real taps on the real keyboard in an Android emulator, plus screenshots of every theme.
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        working-directory: offline-keyboard

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build test APKs
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -PemulatorAbi=x86_64 :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Run UI tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: offline-keyboard
          script: ./gradlew --no-daemon -PemulatorAbi=x86_64 :app:connectedDebugAndroidTest; status=$?; mkdir -p build/screens; adb pull /data/local/tmp/screens build/screens || true; exit $status

      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-keyboard-ui-tests
          path: |
            offline-keyboard/build/screens/
            offline-keyboard/app/build/reports/androidTests/
            offline-keyboard/app/build/outputs/androidTest-results/

      # Screenshots on a fixed release page so they can be viewed without logging in to Actions.
      - name: Publish screenshots
        if: always() && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: keyboard-ui-screens
          name: Offline Keyboard — UI screenshots
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          files: offline-keyboard/build/screens/**/*.png
          body: Screenshots from the latest emulator UI test run (commit ${{ github.sha }}).
