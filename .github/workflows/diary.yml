name: Diary APK

on:
  push:
    paths:
      - 'diary/**'
      - '.github/workflows/diary.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: diary

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, unit tests, lint
        run: |
          ./gradlew --no-daemon testDebugUnitTest lintDebug
          ./gradlew --no-daemon assembleRelease

      # Версія та коміт у назві файлу, щоб на телефоні не сплутати зі старим APK.
      - name: Rename APK
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          APK="Diary-v${VERSION}-${GITHUB_SHA::7}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          # Копія з постійною назвою — одне посилання в закладках завжди дає найновішу збірку.
          cp app/build/outputs/apk/release/app-release.apk Diary.apk
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: diary-apk
          path: |
            diary/${{ env.APK }}
            diary/app/build/reports/lint-results-debug.html

      - name: Remove previous test release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete diary-latest --cleanup-tag --yes || true
          gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '.[] | select(.draft and .tag_name == "diary-latest") | .id' \
            | xargs -r -I{} gh api -X DELETE "repos/${{ github.repository }}/releases/{}" || true

      # Постійне посилання для завантаження APK прямо на телефон.
      - name: Publish rolling test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: diary-latest
          target_commitish: ${{ github.sha }}
          name: Щоденник v${{ env.VERSION }} (тестова збірка)
          prerelease: true
          make_latest: false
          body: |
            Остання тестова збірка Щоденника з гілки ${{ github.ref_name }}.
            Версія: ${{ env.VERSION }}
            Коміт: ${{ github.sha }}
            Постійне посилання: https://github.com/${{ github.repository }}/releases/download/diary-latest/Diary.apk
          files: |
            diary/${{ env.APK }}
            diary/Diary.apk

      - name: Make sure the test release is published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit diary-latest --draft=false --prerelease --target "${{ github.sha }}"
          gh release view diary-latest --json isDraft,assets --jq '"draft=\(.isDraft) assets=\(.assets | length)"'
