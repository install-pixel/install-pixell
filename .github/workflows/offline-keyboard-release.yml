name: Offline Keyboard Release

# Publishes the keyboard: a manual run with a version (for example 1.0.0) publishes the release "OffKey 1.0.0"
# (tag keyboard-v1.0.0) with the APK, and updates the permanent latest-APK link. The offline models change
# rarely and are big (~3.5 GB): they are rebuilt and uploaded to the permanent model release (keyboard-models,
# where the app's Download buttons point) only when asked for (models: true).

on:
  push:
    tags:
      - 'keyboard-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Final release version, e.g. 1.0.0 (empty: just a build)'
        required: false
        default: ''
      models:
        description: 'Also rebuild and upload the offline models (only when they changed)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  apk:
    uses: ./.github/workflows/offline-keyboard.yml
    with:
      screens: false
    permissions:
      contents: write

  models:
    if: inputs.models
    uses: ./.github/workflows/offline-keyboard-models.yml

  publish:
    needs: [apk, models]
    if: always() && needs.apk.result == 'success' && (needs.models.result == 'success' || needs.models.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl

      - name: Collect files
        run: |
          mkdir -p out
          cp dl/offline-keyboard-debug-apk/app-debug.apk out/OfflineKeyboard.apk
          if [ "${{ inputs.models }}" = "true" ]; then
            mkdir -p models
            cp dl/offline-keyboard-mt-*/offline-keyboard-mt-*.zip models/
            for m in vosk-model-small-uk-v3-small vosk-model-small-pl-0.22 vosk-model-small-en-us-0.15; do
              cp "dl/$m/$m.zip" models/
            done
            ls -la models
          fi
          ls -la out

      - name: Publish release
        if: inputs.version == ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: keyboard-build-${{ github.run_number }}
          name: OffKey (збірка ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: out/*
          body: |
            Тестова збірка. Завантажте `OfflineKeyboard.apk` і встановіть (ставиться поверх старої, налаштування зберігаються).
            Моделі голосу й перекладу: https://github.com/${{ github.repository }}/releases/tag/keyboard-models

      - name: Publish the final release
        if: inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: keyboard-v${{ inputs.version }}
          name: OffKey ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: false
          files: out/OfflineKeyboard.apk
          body: |
            **OffKey ${{ inputs.version }}** — офлайн-клавіатура для Android: українська, польська, англійська.
            Без інтернету: набір, автовиправлення, голосовий ввід, переклад між трьома мовами, стікери, теми «Скло» і «Аркуш» (від руки), комп'ютерний режим і Bluetooth-клавіатура.

            **Встановлення:** завантажте `OfflineKeyboard.apk` і встановіть. Нова версія ставиться поверх старої.
            **Моделі** голосу й перекладу (за бажанням, один раз): https://github.com/${{ github.repository }}/releases/tag/keyboard-models — після завантаження «Відкрити» → OffKey.

      # Permanent link to the newest APK: …/releases/download/keyboard-latest/OfflineKeyboard.apk
      - name: Update the latest-APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: keyboard-latest
          name: OffKey — найновіша версія
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: out/OfflineKeyboard.apk
          body: |
            Найновіша збірка клавіатури (збірка ${{ github.run_number }}). Посилання завжди веде на останню версію:
            https://github.com/${{ github.repository }}/releases/download/keyboard-latest/OfflineKeyboard.apk
            Моделі: https://github.com/${{ github.repository }}/releases/tag/keyboard-models

      # A model upload that GitHub broke off (a 500 mid-upload) leaves an asset that is neither replaced nor
      # downloadable, and every later upload of that file fails. Remove such leftovers first.
      - name: Drop half-uploaded model files
        if: inputs.models
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases/tags/keyboard-models" \
            --jq '.assets[] | select(.state != "uploaded") | "\(.id) \(.name) \(.state)"' | while read -r id name state; do
            echo "Removing $name ($state)"
            gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id"
          done || true

      # Fixed address for the app's "Download" buttons: …/releases/download/keyboard-models/<file>.zip
      - name: Update the permanent model release
        if: inputs.models
        uses: softprops/action-gh-release@v2
        with:
          tag_name: keyboard-models
          name: OffKey — моделі
          target_commitish: ${{ github.sha }}
          make_latest: false
          files: models/*.zip
          body: |
            Офлайн-моделі для клавіатури. Кнопки «Завантажити» в застосунку ведуть сюди.
            Після завантаження: Налаштування → «Офлайн-моделі» → «Імпортувати» й виберіть файл (розпаковувати не треба).
